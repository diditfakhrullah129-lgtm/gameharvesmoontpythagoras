<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5e3716">
<title>Petualangan Pythagoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PETUALANGAN PYTHAGORAS — cozy pixel-art RPG (versi satu layar)
   Prinsip tata letak:
   - Halaman TIDAK PERNAH di-scroll. #game memenuhi layar (100dvh):
       HUD (atas) · #app (isi, mengisi sisa tinggi) · dock navigasi (bawah)
   - Isi panjang dibagi menjadi "slide" (tab + tombol Sebelumnya/Berikutnya),
     bukan dipanjangkan ke bawah.
   - Ukuran memakai satuan vh/vw + clamp agar pas di HP maupun komputer.
   ========================================================= */
:root {
  --sky: #8fd0f2; --grass: #5da84a; --grass-d: #3a7a36; --grass-l: #8fd36a;
  --wood: #a8692f; --wood-d: #5e3716; --wood-l: #d79b52; --line: #3a2312;
  --parch: #f6dfa6; --parch-d: #e2bf73; --ink: #2f1d12; --ink-soft: #6b5238;
  --gold: #f7b92b; --blue: #2f7bd8; --green: #43b33f; --red: #d9473a; --purple: #7a4ad0; --white: #fffaf0;
  --sq-a: #6fb7ff; --sq-b: #86d96e; --sq-c: #ff8a78; --tri: #ffd36b;
  --hud-h: 52px; --dock-h: 62px;
  --display: 'Pixelify Sans', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: #2c4a2a; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-text-size-adjust: 100%;
}
img { max-width: 100%; }
/* sprite lama (kecil) tetap tajam; aset baru beresolusi tinggi dihaluskan */
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0 0 .35em; text-wrap: balance; }
p { margin: 0 0 .55em; }
.sr-only, .skip:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip:focus { position: fixed; z-index: 100; left: 8px; top: 8px; background: #fff; padding: 8px 12px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--ink-soft); } .small { font-size: .86rem; } .center { text-align: center; }
.err { color: #b3261e; font-weight: 700; } code { background: rgba(0,0,0,.08); padding: 0 4px; border-radius: 3px; font-size: .85em; }
.loading { color: #fff; text-align: center; padding: 40px; }

/* ---------- Kerangka satu layar ---------- */
#game { position: fixed; inset: 0; display: flex; flex-direction: column; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#app {
  flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; outline: 0;
  background: url(../assets/img/bg_village.svg) center bottom / cover no-repeat, linear-gradient(var(--sky), var(--grass));
  animation: scr-in .3s ease both;
}
@keyframes scr-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.wrap { flex: 1; min-height: 0; width: 100%; max-width: 1100px; margin: 0 auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.wrap.narrow { max-width: 640px; } .wrap.narrowish { max-width: 860px; } .wrap.wide { max-width: 1400px; padding: 6px; }
.grow { flex: 1; min-height: 0; }
.scrollbox { overflow: auto; overflow-x: hidden; min-height: 0; -webkit-overflow-scrolling: touch; }  /* jaring pengaman: hanya aktif bila isi lebih tinggi dari layar kecil */

/* ---------- Panel perkamen (CSS murni, tajam di semua ukuran) ---------- */
.panel {
  position: relative; color: var(--ink); background: linear-gradient(#fcedc0, #f3d994);
  border: 4px solid var(--line); border-radius: 14px;
  box-shadow: inset 0 0 0 3px #fff4d2, inset 0 -5px 0 rgba(166,112,40,.22), 0 4px 0 rgba(36,20,8,.5);
}
.panel.pad { padding: 8px 14px; } .panel.pad-s { padding: 6px 10px; }
.panel.fill { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel-i { background: rgba(255,255,255,.5); border: 3px solid var(--parch-d); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
.h-title { font-size: clamp(1.1rem, 3.3vh, 1.7rem); color: var(--wood-d); margin: 0 0 4px; }
.h-sub { font-size: clamp(1rem, 2.6vh, 1.2rem); color: var(--wood-d); margin: .3em 0 .3em; }
.sep { border: 0; border-top: 3px dashed var(--parch-d); margin: 10px 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.row.center { justify-content: center; } .row.end { justify-content: flex-end; } .row.between { justify-content: space-between; } .row.tight { margin: 4px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; margin: 6px 0; }
.two > * { min-width: 0; }
@media (max-width: 720px), (max-aspect-ratio: 1/1) { .two { grid-template-columns: 1fr; gap: 6px; } }
@media (max-width: 720px) and (min-aspect-ratio: 11/10) { .two { grid-template-columns: 1fr 1fr; } }  /* HP landscape */

/* ---------- Tombol kayu ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 6px 16px;
  font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: .02em; color: #fff7e6; text-shadow: 0 2px 0 rgba(0,0,0,.45);
  background: linear-gradient(var(--wood-l), var(--wood) 55%, #8a5324); border: 3px solid var(--line); border-radius: 10px;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.25), 0 4px 0 var(--line); text-decoration: none;
  transition: transform .08s, filter .15s; user-select: none; touch-action: manipulation;
}
.btn:hover { filter: brightness(1.08); } .btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.25), 0 1px 0 var(--line); }
.btn.green { background: linear-gradient(#7fe06a, var(--green) 55%, #2f8a2c); } .btn.blue { background: linear-gradient(#6fb2ff, var(--blue) 55%, #1f5ca8); }
.btn.purple { background: linear-gradient(#b48bf2, var(--purple) 55%, #5530a3); } .btn.red { background: linear-gradient(#ff8c7e, var(--red) 55%, #a52e24); }
.btn.gold { background: linear-gradient(#ffd86b, #f0a81c 55%, #c47a0c); }
.btn.sm { min-height: 34px; padding: 3px 12px; font-size: .88rem; } .btn.xl { min-height: clamp(46px, 8vh, 62px); font-size: clamp(1.05rem, 2.8vh, 1.35rem); padding: 8px 26px; }
.btn.dis, .btn:disabled { filter: grayscale(1) brightness(.85); cursor: not-allowed; opacity: .7; transform: none; }
.btn .bi { width: 22px; height: 22px; object-fit: contain; } .btn .tri { font-size: .9em; }
.pulse { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { transform: scale(1.04); } }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 999px; background: var(--parch-d); border: 2px solid var(--wood); font-weight: 800; font-size: .82rem; }
.pill.ok { background: #bff0a6; border-color: var(--grass-d); } .pill.big { font-size: 1.05rem; padding: 4px 16px; font-family: var(--display); } .pill .pi { width: 18px; }
.bar { height: 14px; background: #fff7e0; border: 3px solid var(--line); border-radius: 6px; overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--green) 0 10px, #62d35c 10px 20px); transition: width .6s; }
.stars { display: inline-flex; gap: 2px; } .stars .st { width: 26px; height: 26px; object-fit: contain; } .stars .st.off { filter: grayscale(1) opacity(.45); }
.bob { animation: bob 2s ease-in-out infinite; } .bob.b2 { animation-delay: -1s; } @keyframes bob { 50% { transform: translateY(-4px); } }
.float { animation: bob 3s ease-in-out infinite; }
.pop { animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; } @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- HUD ---------- */
#hud {
  flex: none; position: relative; z-index: 30; height: calc(var(--hud-h) + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 8px;
  padding: env(safe-area-inset-top, 0px) 62px 0 10px;
  background: linear-gradient(var(--wood), var(--wood-d)); border-bottom: 4px solid var(--line); box-shadow: 0 3px 0 rgba(0,0,0,.25); color: #fff7e6;
}
.hud-btn { width: 38px; height: 38px; background: var(--parch); border: 3px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: 0 3px 0 var(--line); flex: none; }
.hud-btn img { width: 100%; height: 100%; object-fit: contain; }
.hud-title { font-family: var(--display); font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.hud-player { display: flex; align-items: center; gap: 6px; font-weight: 800; max-width: 130px; }
.hud-av { width: 32px; height: 32px; border: 3px solid var(--line); border-radius: 8px; background: var(--sky); overflow: hidden; flex: none; }
.hud-av img { width: 150%; margin: -3px 0 0 -25%; display: block; } .hud-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .85rem; }
.hud-lv { display: flex; flex-direction: column; font-family: var(--display); font-size: .82rem; min-width: 52px; }
.hud-bar { height: 8px; background: #2a170b; border: 2px solid var(--line); display: block; border-radius: 3px; overflow: hidden; } .hud-bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .5s; }
.hud-stars { display: flex; align-items: center; gap: 3px; font-family: var(--display); } .hud-stars img { width: 24px; height: 24px; object-fit: contain; }
@media (max-width: 720px) { .hud-title, .hud-name { display: none; } .hud-player { max-width: 36px; } #hud { gap: 6px; } }
@media (max-width: 420px) { .hud-lv { min-width: 42px; } }

/* ---------- Dock navigasi bawah ---------- */
#dock {
  flex: none; position: relative; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; align-items: stretch;
  height: calc(var(--dock-h) + env(safe-area-inset-bottom, 0px)); padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(var(--wood), var(--wood-d)); border-top: 4px solid var(--line); box-shadow: 0 -3px 0 rgba(0,0,0,.22);
}
.dk { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; padding: 2px 0; border: 3px solid transparent; border-radius: 10px; background: none; color: #fff0d2; font-family: var(--display); font-size: .68rem; text-shadow: 0 1px 0 rgba(0,0,0,.6); transition: transform .1s, background .15s; }
.dk img { height: 28px; width: auto; max-width: 40px; object-fit: contain; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
.dk span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.dk:hover { background: rgba(255,255,255,.1); } .dk:active { transform: translateY(2px); }
.dk.on { background: linear-gradient(#ffe08a, #f0b43a); border-color: var(--line); color: var(--wood-d); text-shadow: none; box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 2px 0 var(--line); }
@media (max-height: 520px) { :root { --hud-h: 44px; --dock-h: 48px; } .dk { flex-direction: row; gap: 4px; justify-content: center; font-size: .72rem; } .dk img { height: 22px; } .hud-btn { width: 32px; height: 32px; } }
@media (max-width: 380px) { .dk { font-size: .6rem; } .dk img { height: 24px; } }

/* ---------- Audio ---------- */
#audioBtn {
  position: fixed; z-index: 40; top: calc(6px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 44px; height: 40px;
  background: linear-gradient(var(--wood-l), var(--wood)); border: 3px solid var(--line); border-radius: 10px; box-shadow: inset 0 3px 0 rgba(255,255,255,.3), 0 3px 0 var(--line); padding: 0;
}
#audioBtn img { width: 24px; height: 24px; position: absolute; left: 7px; top: 3px; } #audioBtn img.off { display: none; } #audioBtn.muted img.on { display: none; } #audioBtn.muted img.off { display: block; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 10px; } #audioBtn .eq { position: absolute; left: 11px; bottom: 2px; }
.eq i { width: 4px; height: 3px; background: var(--wood-d); display: block; } #audioBtn .eq i { background: #fff7e6; }
.eq.on i, #audioBtn.playing .eq i { animation: eq .8s ease-in-out infinite; } .eq i:nth-child(2) { animation-delay: -.2s !important; } .eq i:nth-child(3) { animation-delay: -.45s !important; } .eq i:nth-child(4) { animation-delay: -.1s !important; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 10px; } }
#audioHint { position: fixed; z-index: 39; top: calc(56px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); background: var(--parch); border: 3px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: .85rem; font-weight: 800; max-width: 190px; animation: bob 1.6s infinite; }
#audioPanel { position: fixed; z-index: 45; top: calc(54px + env(safe-area-inset-top, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); width: min(340px, calc(100vw - 16px)); max-height: calc(100dvh - 70px); overflow: auto; padding: 8px 12px 10px; }
.ap-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 1.1rem; margin-bottom: 4px; }
.x-btn { background: var(--red); color: #fff; border: 3px solid var(--line); border-radius: 8px; width: 32px; height: 32px; font-size: 1.1rem; line-height: 1; font-weight: 800; }
.ap-now { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.5); border-radius: 8px; padding: 5px 8px; margin: 4px 0 8px; font-size: .85rem; }
.ap-ch { background: rgba(255,255,255,.45); border: 3px solid var(--parch-d); border-radius: 10px; padding: 6px 8px; margin: 6px 0; }
.ap-ch-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 800; }
.ap-sw { min-width: 84px; } .ap-sw.off { filter: grayscale(.8) brightness(.9); }
.ap-vol { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: .78rem; font-weight: 800; color: var(--ink-soft); } .ap-vol input { flex: 1; }
input[type=range] { accent-color: var(--wood); width: 100%; min-height: 28px; }
.ap-det { margin: 8px 0; } .ap-det summary { cursor: pointer; font-weight: 800; } .ap-det ul { list-style: none; padding: 0; margin: 6px 0; font-size: .78rem; }
.ap-det li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--parch-d); padding: 2px 0; } .ap-det li span { overflow: hidden; text-overflow: ellipsis; } .ap-det em { font-style: normal; font-weight: 800; flex: none; }
.st-file em { color: #2f8a2c; } .st-synth em { color: #8a5a00; } .st-none em, .st-error em { color: #999; }

/* ---------- Modal, toast, efek ---------- */
#modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 12px; }
.modal-back { position: absolute; inset: 0; background: rgba(20,12,6,.65); }
.modal-card { position: relative; width: min(520px, 100%); max-height: calc(100dvh - 24px); overflow: auto; padding: 10px 16px 12px; animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; }
.modal-text { font-size: 1rem; } .modal-open { overflow: hidden; }
.pos-modal .pm-pic { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: clamp(60px, 14vh, 110px); margin-bottom: 4px; } .pm-pic img { max-height: 100%; max-width: 70%; object-fit: contain; }
#toasts { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); top: calc(var(--hud-h) + 8px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--parch); border: 3px solid var(--line); border-radius: 12px; padding: 6px 14px; font-weight: 800; box-shadow: 0 4px 0 var(--line); animation: pop .35s both; } .toast.out { opacity: 0; transition: opacity .4s; } .toast .ti { width: 28px; height: 28px; object-fit: contain; }
#fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.conf { position: absolute; top: -20px; animation: fall 2s linear forwards; } @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
.reward { text-align: center; } .reward-chest img { width: clamp(70px, 16vh, 120px); } .reward h2 { margin: 2px 0; } .reward .xp-line { font-family: var(--display); font-size: 1.3rem; color: var(--green); margin: 0 0 4px; } .reward-stars .st { width: 42px; height: 42px; animation: pop .6s both; }
.reward-stars .st:nth-child(2) { animation-delay: .2s; } .reward-stars .st:nth-child(3) { animation-delay: .4s; }
.unlock-line { display: inline-flex; align-items: center; gap: 6px; background: #e5f8d9; border: 3px solid var(--green); border-radius: 999px; padding: 2px 14px; font-weight: 800; margin-bottom: 6px; animation: pop .5s .9s both; }

/* ---------- Pemandu (guru / burung hantu) ---------- */
.guide { display: flex; align-items: flex-end; gap: 6px; margin: 2px 0; } .guide-pic { flex: none; width: clamp(44px, 9vh, 70px); } .guide-pic img { width: 100%; display: block; }
.guide-bubble { flex: 1; min-width: 0; padding: 4px 10px; } .guide-name { font-family: var(--display); color: var(--wood-d); font-size: .9rem; } .guide-bubble p { margin: 0; font-size: .92rem; line-height: 1.3; }
@media (max-height: 640px) { .guide.hide-short { display: none; } }

/* =====================================================
   PEMBUKA (splash)
   ===================================================== */
.splash { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.sp-bg { position: absolute; inset: 0; background: url(../assets/img/bg_village.svg) center bottom / cover no-repeat; }
.cloud { position: absolute; left: -22vw; width: clamp(110px, 16vw, 220px); aspect-ratio: 2.4; background: url(../assets/img/cloud.svg) center / contain no-repeat; opacity: .95; animation: drift 70s linear infinite; }
.k1 { top: 5%; } .k2 { top: 17%; animation-duration: 95s; animation-delay: -45s; transform: scale(.7); } .k3 { top: 2%; animation-duration: 80s; animation-delay: -18s; }
@keyframes drift { to { transform: translateX(140vw); } }
.sp-deco { position: absolute; pointer-events: none; transform-origin: 50% 100%; }
.sp-deco img { display: block; height: 100%; width: auto; filter: drop-shadow(0 6px 4px rgba(20,50,20,.25)); }
.d-mill { left: 3%; bottom: 17%; height: clamp(70px, 24vh, 250px); } .d-house { right: 3%; bottom: 16%; height: clamp(60px, 22vh, 230px); }
.d-t1 { left: 15%; bottom: 7%; height: clamp(60px, 22vh, 230px); animation: sway 5s ease-in-out infinite; } .d-t2 { right: 17%; bottom: 6%; height: clamp(60px, 25vh, 250px); animation: sway 6s ease-in-out -2s infinite; }
.d-t3 { left: 0; bottom: 3%; height: clamp(50px, 15vh, 160px); animation: sway 5.5s ease-in-out -1s infinite; } .d-t4 { right: 0; bottom: 2%; height: clamp(50px, 17vh, 180px); animation: sway 7s ease-in-out -3s infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
.d-char { bottom: 3%; height: clamp(80px, 21vh, 190px); } .d-char img { filter: drop-shadow(0 5px 3px rgba(0,0,0,.25)); } .d-teacher { left: 24%; } .d-player { right: 25%; }
.sparks i { position: absolute; bottom: 12%; width: 6px; height: 6px; border-radius: 50%; background: #fff3a0; box-shadow: 0 0 8px #ffe35c; animation: rise 5s linear infinite; } @keyframes rise { to { transform: translateY(-60vh) translateX(20px); opacity: 0; } }
.sp-owl { position: absolute; top: 14%; left: 6%; width: clamp(44px, 8vh, 72px); animation: flyby 14s ease-in-out infinite alternate; } .sp-owl img { width: 100%; display: block; } @keyframes flyby { to { left: 74%; top: 22%; } }
.sp-main { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1.2vh, 12px); padding: 8px 14px; max-width: 100%; }
.sp-logo { margin: 0; line-height: 0; } .logo-img { width: min(88vw, 540px, 36vh * 1.677); height: auto; display: block; filter: drop-shadow(0 6px 0 rgba(0,0,0,.22)); }
.sp-sub { font-family: var(--display); font-size: clamp(.8rem, 2.2vh, 1.1rem); color: #fff; text-shadow: 0 2px 0 var(--line), 0 0 8px rgba(0,0,0,.5); margin: 0; text-align: center; }
.speech { background: var(--white); border: 3px solid var(--line); border-radius: 12px; padding: 3px 14px; font-weight: 800; font-size: clamp(.8rem, 2.1vh, 1rem); position: relative; max-width: 88vw; text-align: center; }
.speech::after { content: ''; position: absolute; left: 50%; bottom: -10px; margin-left: -8px; border: 8px solid transparent; border-top-color: var(--line); border-bottom: 0; }
.sp-btns { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 12px); margin-top: clamp(4px, 1vh, 10px); }
.sp-mini { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

.c4 { background: linear-gradient(#c49bf5, #6238b4); } .c5 { background: linear-gradient(#5fd6bd, #228f7d); } .c6 { background: linear-gradient(#ffb06b, #d9622a); }
.c7 { background: linear-gradient(#6fb2ff, #2a52b0); } .c8 { background: linear-gradient(#ff9bb5, #cc4670); } .c9 { background: linear-gradient(#ffe07a, #d8a01c); }

/* ---------- Daftar tujuan, petunjuk ---------- */

/* =====================================================
   PETA PETUALANGAN (satu layar penuh, tanpa geser)
   ===================================================== */
.map-top { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; flex: none; } .mt-l { flex: 1; min-width: 0; } .mt-l b { font-family: var(--display); font-size: .95rem; }

.node.locked .node-spr { filter: grayscale(.9) brightness(.8); } .node.current .node-spr > img { animation: bob 1.6s ease-in-out infinite; } .node.current::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 16px; height: 10px; border-radius: 50%; background: rgba(255,230,120,.7); z-index: -1; animation: pulse 1.4s infinite; }

.node.done .node-tag b { background: var(--green); } .node-stars { min-height: 4px; } .node-stars .st { width: clamp(11px, 2.6vh, 17px); height: clamp(11px, 2.6vh, 17px); }
.hero { position: absolute; right: -6%; bottom: 20px; width: calc(5 * var(--u)); z-index: 5; pointer-events: none; } .hero img { width: 100%; display: block; } .hero.arrive { animation: pop .6s both; } .hero.idle img { animation: bob 1.8s ease-in-out infinite; }
@media (max-aspect-ratio: 1/1) {
  .node { left: calc(var(--px) * 1%); top: calc(var(--py) * 1%); width: calc(var(--pw) * 1cqw); }

}

   BUKU (slide materi / misi)  — pengganti halaman panjang
   ===================================================== */

.ground { fill: #5da84a; } .skyr { fill: #bfe6f8; } .wall { fill: #c98d4b; stroke: var(--line); stroke-width: 3; } .winn { fill: #8fd0f2; stroke: var(--line); stroke-width: 2; } .ladder, .plank { stroke: #8a5324; stroke-width: 7; stroke-linecap: round; } .ghost { stroke-dasharray: 8 8; opacity: .55; stroke: #d9473a; }
.rope { stroke: #7a4a22; stroke-width: 4; } .pole { fill: #8a5324; } .tower { fill: #9aa3b4; stroke: var(--line); stroke-width: 2; } .flag { fill: var(--red); } .water { fill: #4aa3e0; } .cliff { fill: #8a6a42; stroke: var(--line); stroke-width: 3; } .grass { fill: #5da84a; } .field { fill: #78c15c; stroke: #fff; stroke-width: 3; } .paper { fill: #fffdf4; } .gridl { stroke: #d9d2b8; stroke-width: 1; } .pt { fill: var(--red); stroke: var(--line); stroke-width: 2; }

/* =====================================================
   GAME & KUIS
   ===================================================== */

@media (max-aspect-ratio: 3/4) { .game-grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, minmax(0, 1fr)); } }
.game-card { display: flex; flex-direction: column; justify-content: space-between; gap: 2px; min-height: 0; padding: 8px 12px; overflow: hidden; }
.game-card .desc { font-size: clamp(.7rem, 1.8vh, .88rem); line-height: 1.2; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gc-top { display: flex; gap: 10px; align-items: center; } .gc-top h3 { margin: 0; font-size: clamp(.92rem, 2.6vh, 1.15rem); } .gc-top p { margin: 0; } .gc-stat { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0; font-size: .8rem; } .gc-stat .st { width: 22px; height: 22px; }

.gsplit { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; } .gsplit > * { min-width: 0; }

.gc-stat, .intro { }
.intro { display: flex; flex-direction: column; flex: 1; min-height: 0; justify-content: center; }
.figbox { position: relative; width: min(100%, 440px, calc(36dvh * var(--ar, 1.3))); margin: 4px auto; aspect-ratio: var(--ar, 1.3); background: #fff; border: 3px solid var(--parch-d); border-radius: 10px; } .figbox .viz { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; }

/* =========================================================
   PENYIMPANAN & GAMIFIKASI (LocalStorage) — XP, level, bintang, lencana, progres
   ========================================================= */
(function () {
  const KEY = 'pp_save_v1';
  const XP_PER_LEVEL = 120;

  function fresh() {
    return {
      v: 1, name: '', kelas: '', avatar: 'boy', created: Date.now(),
      xp: 0, badges: {}, missions: {}, finish: false,
      games: { A: null, B: null, C: null, D: null },
      quiz: { best: null, last: null, attempts: 0, draft: null, timerMin: 15 },
      tally: { correct: 0, wrong: 0 },
      materiSeen: {}, explored: 0,
      reflection: null, videoUrls: {}
    };
  }
  const S = { data: fresh(), ok: true, listeners: [] };

  S.load = function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); S.data = Object.assign(fresh(), d); S.data.quiz = Object.assign(fresh().quiz, d.quiz || {}); }
    } catch (e) { S.ok = false; S.data = fresh(); }
  };
  S.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify(S.data)); S.ok = true; }
    catch (e) { S.ok = false; }
    S.listeners.forEach(f => f());
  };
  S.onChange = fn => S.listeners.push(fn);
  S.reset = function () { S.data = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} S.save(); };

  /* ---------- XP / level ---------- */
  S.level = () => Math.floor(S.data.xp / XP_PER_LEVEL) + 1;
  S.xpInLevel = () => S.data.xp % XP_PER_LEVEL;
  S.XP_PER_LEVEL = XP_PER_LEVEL;
  S.addXP = function (n, silent) {
    const before = S.level();
    S.data.xp += Math.max(0, Math.round(n));
    S.save();
    if (S.level() > before) { PP.ui && PP.ui.toast('LEVEL UP! Sekarang level ' + S.level(), 'owl'); setTimeout(() => PPAudio.sfx('star'), 900); }
    S.checkBadges();
    if (!silent) PPAudio.sfx('point');
  };

  /* ---------- bintang ---------- */
  S.missionStars = () => Object.values(S.data.missions).reduce((a, m) => a + (m.stars || 0), 0);
  S.gameStars = () => Object.values(S.data.games).reduce((a, g) => a + (g ? g.stars : 0), 0);
  S.quizStars = () => (S.data.quiz.best ? starsFor(S.data.quiz.best.score) : 0);
  S.totalStars = () => S.missionStars() + S.gameStars() + S.quizStars();
  S.maxStars = () => 6 * 3 + 4 * 3 + 3;
  function starsFor(score) { return score >= 90 ? 3 : score >= 70 ? 2 : score >= 50 ? 1 : 0; }
  S.starsFor = starsFor;

  /* ---------- misi ---------- */
  S.missionDone = id => !!(S.data.missions[id] && S.data.missions[id].done);
  S.missionUnlocked = id => id === 1 || S.missionDone(id - 1);
  S.doneCount = () => PP.POS.filter(p => S.missionDone(p.id)).length;
  S.nextMission = () => { const p = PP.POS.find(p => !S.missionDone(p.id)); return p ? p.id : null; };
  S.completeMission = function (id, stars) {
    const first = !S.missionDone(id);
    const prev = S.data.missions[id] || { done: false, stars: 0, plays: 0 };
    prev.done = true; prev.stars = Math.max(prev.stars || 0, stars); prev.plays = (prev.plays || 0) + 1; prev.date = Date.now();
    S.data.missions[id] = prev;
    S.save();
    if (first) { S.addXP(50 + 10 * stars, true); S.award('m' + id, true); }
    return first;
  };

  /* ---------- game ---------- */
  // res: {score(0-100), correct, wrong}
  S.recordGame = function (gid, res) {
    const stars = starsFor(res.score);
    const g = S.data.games[gid] || { best: 0, stars: 0, plays: 0, correct: 0, wrong: 0, lastScore: 0 };
    g.plays++; g.lastScore = res.score; g.best = Math.max(g.best, res.score); g.stars = Math.max(g.stars, stars);
    g.correct += res.correct; g.wrong += res.wrong; g.date = Date.now();
    S.data.games[gid] = g;
    S.data.tally.correct += res.correct; S.data.tally.wrong += res.wrong;
    S.save();
    if (res.score >= 100) S.award('perfect');
    S.addXP(Math.round(res.score / 4), true);
    return stars;
  };
  S.tallyAnswer = function (ok) { ok ? S.data.tally.correct++ : S.data.tally.wrong++; };

  /* ---------- lencana ---------- */
  S.award = function (id, silent) {
    if (S.data.badges[id]) return false;
    S.data.badges[id] = Date.now();
    S.save();
    const b = PP.BADGES.find(x => x.id === id);
    if (b && PP.ui) { PP.ui.toast('Lencana baru: ' + b.name, 'star'); if (!silent) setTimeout(() => PPAudio.sfx('star'), 900); }
    S.data.xp += 20; S.save();
    return true;
  };
  S.checkBadges = function () {
    if (S.level() >= 5) S.award('lv5');
    if (PP.MATERI_IDS && PP.MATERI_IDS.every(i => S.data.materiSeen[i])) S.award('reader');
  };

  /* ---------- nilai ---------- */
  S.gameAvg = function () {
    const arr = ['A', 'B', 'C', 'D'].map(k => (S.data.games[k] ? S.data.games[k].best : null)).filter(v => v != null);
    return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  };
  S.finalScore = function () {
    const q = S.data.quiz.best ? S.data.quiz.best.score : 0;
    const g = ['A', 'B', 'C', 'D'].reduce((a, k) => a + (S.data.games[k] ? S.data.games[k].best : 0), 0) / 4;
    const m = S.doneCount() / 6 * 100;
    return Math.round(0.4 * q + 0.4 * g + 0.2 * m);
  };
  S.predikat = function (score) {
    if (score >= 90) return { t: 'Sangat Baik', d: 'Pythagoras Master! Pemahamanmu sangat kuat.' };
    if (score >= 80) return { t: 'Baik', d: 'Bagus sekali! Sedikit lagi menjadi master.' };
    if (score >= 70) return { t: 'Cukup', d: 'Sudah paham dasar-dasarnya. Terus berlatih.' };
    if (score >= 50) return { t: 'Perlu Berlatih', d: 'Ulangi materi dan game agar lebih mantap.' };
    return { t: 'Perlu Bimbingan', d: 'Jangan menyerah. Mulai lagi dari materi dan peta petualangan.' };
  };

  window.PPStore = S;
})();

</script>
<script>
/* =========================================================
   SISTEM AUDIO TERPUSAT — memakai PP_AUDIO_CONFIG (js/audio-config.js)

   Aturan utama:
   - Musik latar : satu trek pada satu waktu, crossfade antar-halaman, loop.
   - Efek suara  : dimainkan lewat Web Audio (bila file dapat dimuat) atau
                   kumpulan elemen <audio> (berfungsi juga saat game dibuka
                   langsung dari file / tanpa server). Efek tidak saling
                   memotong, kecuali satu grup (jawaban benar <-> salah).
   - Satu ketukan = satu suara: efek "semantik" (jawaban, hadiah, misi,
                   pindah halaman) menahan klik biasa yang datang bersamaan.
   - Autoplay    : audio dibuka pada interaksi pertama pengguna.
   - Pengaturan  : musik & efek punya ON/OFF dan volume sendiri (tersimpan).
   - Semua status audio disimpan di window.PPAudio — tidak terikat halaman,
     sehingga efek suara tetap berjalan ketika pemain berpindah halaman.
   ========================================================= */
(function () {
  const CFG = window.PP_AUDIO_CONFIG;
  const KEY = 'pp_audio_v1';
  const DEF = { master: true, musicOn: true, sfxOn: true, music: 0.6, sfx: 0.8, narr: 1.0 };
  const POOL = 3;                                   // elemen <audio> per efek

  const A = {
    cfg: CFG,
    set: Object.assign({}, DEF),
    status: {},                // id -> 'file' | 'synth' | 'none' | 'error'
    els: {},                   // cache elemen BGM
    curId: null,               // trek BGM yang diminta
    userPaused: false,         // (kompatibilitas lama; kini memakai set.musicOn)
    needGesture: false,
    unlocked: false,
    ctx: null, buf: {}, bufTried: {},
    pool: {}, active: [], last: {}, lastSemantic: 0, semanticCount: 0,
    narr: null, narrId: null,
    listeners: [], scene: null,
    duck: 1,                   // pengecilan musik oleh narasi
    sduck: 1                   // pengecilan musik sementara oleh efek besar
  };

  /* ---------- penyimpanan ---------- */
  try { Object.assign(A.set, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  A.save = function () { try { localStorage.setItem(KEY, JSON.stringify(A.set)); } catch (e) {} };
  A.on = function (fn) { A.listeners.push(fn); };
  A.emit = function () { A.listeners.forEach(f => { try { f(); } catch (e) {} }); };

  /* ---------- status ketersediaan ---------- */
  Object.keys(CFG.tracks).forEach(id => {
    const t = CFG.tracks[id];
    A.status[id] = t.available ? 'file' : (t.synth ? 'synth' : 'none');
  });
  A.hasFile = id => A.status[id] === 'file';
  A.src = id => CFG.basePath + CFG.tracks[id].file;

  function chanVol(t) {
    const cat = CFG.categories[t.category] || { channel: 'sfx', gain: 1 };
    const ch = A.set[cat.channel === 'music' ? 'music' : cat.channel === 'narration' ? 'narr' : 'sfx'];
    return Math.min(1, (t.volume == null ? 1 : t.volume) * cat.gain * ch);
  }
  const wanted = () => A.set.master && A.set.musicOn;

  /* =======================================================
     MUSIK LATAR
     ======================================================= */
  function getEl(id) {
    if (A.els[id]) return A.els[id];
    const t = CFG.tracks[id];
    const el = new Audio();
    el.preload = 'auto';
    el.loop = t.loop !== false;
    el.volume = 0;
    el.setAttribute('playsinline', '');
    el.addEventListener('error', () => {
      A.status[id] = 'error';
      if (A.curId === id) A.curId = null;
      A.emit();
    });
    el.src = A.src(id);
    A.els[id] = el;
    return el;
  }
  function fade(el, to, ms, done) {
    clearInterval(el._fx);
    const from = el.volume, t0 = performance.now();
    if (ms <= 0) { el.volume = to; done && done(); return; }
    el._fx = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) { clearInterval(el._fx); done && done(); }
    }, 40);
  }
  function musicTarget(id) {
    const t = CFG.tracks[id];
    const sg = (CFG.sceneGain && A.scene && CFG.sceneGain[A.scene]) || 1;
    return chanVol(t) * sg * A.duck * A.sduck;
  }

  A.playBgm = function (id) {
    A.curId = id;
    Object.keys(A.els).forEach(k => {
      if (k !== id) { const o = A.els[k]; fade(o, 0, 600, () => { if (A.curId !== k) o.pause(); }); }
    });
    if (!id || !A.hasFile(id) || !wanted()) { A.emit(); return; }
    const el = getEl(id);
    const p = el.play();
    if (p && p.catch) p.catch(() => { A.needGesture = true; A.emit(); });
    fade(el, musicTarget(id), 900);
    A.emit();
  };
  A.stopBgm = function () { A.playBgm(null); };

  A.scene_ = function (sceneKey) {
    A.scene = sceneKey;
    const id = CFG.sceneMusic[sceneKey];
    if (id === A.curId && A.els[id] && !A.els[id].paused) { fade(A.els[id], musicTarget(id), 400); return; }
    A.playBgm(id || null);
  };

  A.applyVolumes = function () {
    Object.keys(A.els).forEach(k => {
      const el = A.els[k];
      if (k === A.curId && wanted()) { clearInterval(el._fx); el.volume = musicTarget(k); }
    });
    if (A.narr) A.narr.volume = A.set.master ? chanVol(CFG.tracks[A.narrId]) : 0;
  };

  /* Kecilkan musik sebentar saat efek besar berbunyi (misi, kemenangan) */
  let duckTimer = null;
  A.duckFor = function (level, ms) {
    A.sduck = level;
    const el = A.curId && A.els[A.curId];
    if (el && wanted()) fade(el, musicTarget(A.curId), 120);
    clearTimeout(duckTimer);
    duckTimer = setTimeout(() => {
      A.sduck = 1;
      const e = A.curId && A.els[A.curId];
      if (e && wanted()) fade(e, musicTarget(A.curId), 700);
    }, ms);
  };

  /* Musik ON / OFF (terpisah dari efek suara) */
  A.setMusicOn = function (on) {
    A.set.musicOn = !!on; A.save();
    if (!on) Object.values(A.els).forEach(el => fade(el, 0, 250, () => el.pause()));
    else if (A.curId) A.playBgm(A.curId);
    A.emit();
  };
  A.toggleMusic = function () { A.setMusicOn(!A.set.musicOn); };
  A.setMaster = function (on) {
    A.set.master = on; A.save();
    if (!on) { Object.values(A.els).forEach(el => fade(el, 0, 200, () => el.pause())); A.stopNarration(); A.stopAllSfx(); }
    else if (A.curId) A.playBgm(A.curId);
    A.emit();
  };
  A.setSfx = function (on) { A.set.sfxOn = !!on; A.save(); if (!on) A.stopAllSfx(); A.emit(); };
  A.setVol = function (ch, v) { A.set[ch] = v; A.save(); A.applyVolumes(); A.emit(); };
  A.isPlaying = function () {
    const el = A.curId && A.els[A.curId];
    return !!(el && !el.paused && wanted());
  };

  /* =======================================================
     BUKA KUNCI AUTOPLAY (interaksi pertama pengguna)
     ======================================================= */
  function ensureCtx() {
    if (A.ctx) return A.ctx;
    try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) A.ctx = new AC(); } catch (e) {}
    return A.ctx;
  }
  let primed = false;
  function primePools() {              // iOS/Android: elemen <audio> baru boleh diputar setelah 1x "disentuh" lewat gesture
    if (primed) return; primed = true;
    Object.keys(CFG.tracks).forEach(id => {
      const t = CFG.tracks[id];
      if (t.category !== 'sfx' || !A.hasFile(id)) return;
      poolFor(id).els.forEach(el => {
        try {
          el.muted = true;
          const p = el.play();
          const back = () => { el.pause(); el.currentTime = 0; el.muted = false; };
          if (p && p.then) p.then(back, () => { el.muted = false; }); else back();
        } catch (e) {}
      });
    });
  }
  A.unlock = function () {
    const c = ensureCtx();
    try { if (c && c.state === 'suspended') c.resume(); } catch (e) {}
    primePools(); loadBuffers();
    if (A.curId && wanted()) {
      const el = A.els[A.curId];
      if (!el || el.paused) A.playBgm(A.curId);
    }
    A.needGesture = false;
    A.unlocked = true;
  };
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev =>
    window.addEventListener(ev, () => A.unlock(), { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Object.values(A.els).forEach(el => el.pause()); if (A.ctx && A.ctx.state === 'running') A.ctx.suspend(); }
    else {
      if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
      if (A.curId && wanted()) A.playBgm(A.curId);
    }
  });

  /* =======================================================
     EFEK SUARA
     ======================================================= */
  function poolFor(id) {
    if (A.pool[id]) return A.pool[id];
    const t = CFG.tracks[id], els = [];
    for (let i = 0; i < POOL; i++) {
      const el = new Audio(); el.preload = 'auto'; el.setAttribute('playsinline', '');
      el.addEventListener('error', () => { if (A.status[id] === 'file') { A.status[id] = t.synth ? 'synth' : 'error'; A.emit(); } });
      el.src = A.src(id); els.push(el);
    }
    return (A.pool[id] = { els, i: 0 });
  }

  /* Web Audio: muat & decode sekali (hanya bila lewat http/https; file:// memakai elemen <audio>) */
  function loadBuffers() {
    if (!/^https?:$/.test(location.protocol) || !window.fetch) return;
    const c = ensureCtx(); if (!c) return;
    Object.keys(CFG.tracks).forEach(id => {
      const t = CFG.tracks[id];
      if (t.category !== 'sfx' || !A.hasFile(id) || A.bufTried[id]) return;
      A.bufTried[id] = true;
      fetch(A.src(id)).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(ab => new Promise((ok, no) => c.decodeAudioData(ab, ok, no)))
        .then(b => { A.buf[id] = b; })
        .catch(() => { /* tetap memakai elemen <audio> */ });
    });
  }

  function track(rec) {
    A.active.push(rec);
    return rec;
  }
  function untrack(rec) { const i = A.active.indexOf(rec); if (i >= 0) A.active.splice(i, 1); }
  function stopRec(rec) { try { rec.stop(); } catch (e) {} untrack(rec); }
  A.stopAllSfx = function () { A.active.slice().forEach(stopRec); };

  function playFile(id, vol, group) {
    const c = A.ctx;
    if (A.buf[id] && c && c.state === 'running') {
      const src = c.createBufferSource(), g = c.createGain();
      src.buffer = A.buf[id]; g.gain.value = vol;
      src.connect(g); g.connect(c.destination);
      const rec = track({ id, group, stop: () => src.stop() });
      src.onended = () => untrack(rec);
      src.start();
      return A.buf[id].duration * 1000;
    }
    const p = poolFor(id);
    let el = p.els.find(e => e.paused || e.ended);
    if (!el) { el = p.els[p.i++ % p.els.length]; }
    try { el.pause(); el.currentTime = 0; } catch (e) {}
    el.muted = false; el.volume = vol;
    const rec = track({ id, group, stop: () => { el.pause(); el.currentTime = 0; } });
    el.onended = () => untrack(rec);
    const pr = el.play();
    if (pr && pr.catch) pr.catch(() => untrack(rec));
    return (el.duration && isFinite(el.duration) ? el.duration * 1000 : 900);
  }

  /* nada sintetis cadangan — hanya dipakai bila file WAV gagal dimuat */
  function synth(kind, vol) {
    const ctx = ensureCtx(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    const note = (f, t0, dur, type, g, f2) => {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, now + t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + t0 + dur);
      const peak = (g || 0.25) * vol;
      gn.gain.setValueAtTime(0.0001, now + t0);
      gn.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), now + t0 + 0.01);
      gn.gain.exponentialRampToValueAtTime(0.0001, now + t0 + dur);
      o.connect(gn); gn.connect(ctx.destination);
      o.start(now + t0); o.stop(now + t0 + dur + 0.02);
    };
    const C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5;
    switch (kind) {
      case 'click':  note(760, 0, 0.05, 'square', 0.18); note(1100, 0.03, 0.05, 'square', 0.12); break;
      case 'page':   note(400, 0, 0.12, 'triangle', 0.2, 900); break;
      case 'start':  [C5, E5, G5, C6].forEach((f, i) => note(f, i * 0.08, 0.12, 'square', 0.2)); break;
      case 'correct':[C5, E5, G5].forEach((f, i) => note(f, i * 0.09, 0.14, 'square', 0.22)); note(C6, 0.28, 0.25, 'triangle', 0.25); break;
      case 'wrong':  note(220, 0, 0.18, 'sawtooth', 0.2, 150); note(150, 0.16, 0.25, 'sawtooth', 0.2, 90); break;
      case 'star':   note(1568, 0, 0.1, 'triangle', 0.25); note(2093, 0.08, 0.25, 'triangle', 0.22); break;
      case 'mission':[C5, E5, G5, C6, G5, C6].forEach((f, i) => note(f, i * 0.1, 0.16, 'square', 0.2)); break;
      case 'victory':[C5, C5, C5, G5, E5, G5, C6].forEach((f, i) => note(f, i * 0.14 + (i > 3 ? 0.1 : 0), i === 6 ? 0.7 : 0.18, 'square', 0.2)); break;
    }
  }

  /* Titik masuk efek suara. `event` boleh nama peristiwa (click, correct, ...) atau id trek. */
  A.sfx = function (event) {
    if (!A.set.master || !A.set.sfxOn) return;
    // 'point' (tambahan XP) hanya berbunyi bila tidak ada suara lain di sekitarnya
    if (event === 'point') {
      setTimeout(() => { if (performance.now() - A.lastSemantic > 1500) A.sfx('point_now'); }, 380);
      return;
    }
    const id = CFG.events[event] || event;
    const t = CFG.tracks[id]; if (!t) return;
    const now = performance.now();
    const generic = CFG.generic.indexOf(event) >= 0;

    // klik biasa kalah oleh efek semantik yang baru saja berbunyi (1 ketukan = 1 suara)
    if (generic && now - A.lastSemantic < 280) return;
    // cegah pemutaran berulang trek yang sama dalam waktu sangat singkat
    if (now - (A.last[id] || 0) < (CFG.minGap[id] || 40)) return;
    A.last[id] = now;
    if (!generic) { A.lastSemantic = now; A.semanticCount++; }

    // jawaban benar & salah tidak pernah berbunyi bersamaan
    if (t.group) A.active.filter(r => r.group === t.group).forEach(stopRec);

    const vol = Math.min(1, chanVol(t) * ((CFG.eventGain && CFG.eventGain[event]) || 1));
    let ms = 900;
    if (A.status[id] === 'file') ms = playFile(id, vol, t.group);
    else if (t.synth) { try { synth(t.synth, Math.min(1, vol * 1.1)); } catch (e) {} }
    if (t.duck) A.duckFor(t.duck, Math.max(700, ms));
  };

  /* =======================================================
     NARASI & SUARA KARAKTER (hanya bila file tersedia)
     ======================================================= */
  A.narrationAvailable = id => !!CFG.tracks[id] && A.hasFile(id);
  A.playNarration = function (id) {
    if (!A.set.master || !A.narrationAvailable(id)) return false;
    A.stopNarration();
    const t = CFG.tracks[id];
    const a = new Audio(A.src(id)); a.volume = chanVol(t);
    a.addEventListener('ended', () => { A.narr = null; A.duck = 1; A.applyVolumes(); A.emit(); });
    a.addEventListener('error', () => { A.status[id] = 'error'; A.narr = null; A.duck = 1; A.applyVolumes(); A.emit(); });
    A.narr = a; A.narrId = id; A.duck = 0.3; A.applyVolumes();
    const p = a.play(); if (p && p.catch) p.catch(() => {});
    A.emit(); return true;
  };
  A.pauseNarration = function () { if (A.narr) { A.narr.pause(); A.duck = 1; A.applyVolumes(); A.emit(); } };
  A.resumeNarration = function () { if (A.narr) { A.duck = 0.3; A.applyVolumes(); A.narr.play().catch(() => {}); A.emit(); } };
  A.stopNarration = function () {
    if (A.narr) { A.narr.pause(); A.narr = null; }
    A.duck = 1; A.applyVolumes(); A.emit();
  };
  A.narrationState = function (id) {
    if (!A.narrationAvailable(id)) return 'missing';
    if (A.narr && A.narrId === id) return A.narr.paused ? 'paused' : 'playing';
    return 'idle';
  };
  A.voice = function (id) { return A.playNarration(id); };

  /* Muat awal: elemen efek dibuat lebih dulu agar siap saat dibutuhkan */
  Object.keys(CFG.tracks).forEach(id => { const t = CFG.tracks[id]; if (t.category === 'sfx' && A.hasFile(id)) poolFor(id); });

  window.PPAudio = A;
})();

</script>
<script>
/* =========================================================
   VISUALISASI MATEMATIKA (SVG) — semua dihitung dari angka sebenarnya
   ========================================================= */
(function () {
  const V = {};
  const f = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
  V.fmt = f;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  /* ---------- Segitiga siku-siku dengan orientasi bebas ----------
     o: {H: panjang kaki horizontal, V: panjang kaki vertikal, corner:'bl'|'br'|'tl'|'tr',
         labels:{h,v,hyp}, w,h, hl:'h'|'v'|'hyp', mark:true, idPrefix}
     return {svg, pts:{h:{x,y},v:{x,y},hyp:{x,y}} (koordinat viewBox), W,Hh}                */
  V.tri = function (o) {
    const W = o.w || 320, Hh = o.h || 220, m = o.m || 40;
    const H = o.H, Vv = o.V, c = o.corner || 'bl';
    const s = Math.min((W - 2 * m) / H, (Hh - 2 * m) / Vv);
    const tw = H * s, th = Vv * s, ox = (W - tw) / 2, oy = (Hh - th) / 2;
    const map = {
      bl: { P: [0, Vv], A: [H, Vv], B: [0, 0] }, br: { P: [H, Vv], A: [0, Vv], B: [H, 0] },
      tl: { P: [0, 0], A: [H, 0], B: [0, Vv] }, tr: { P: [H, 0], A: [0, 0], B: [H, Vv] }
    }[c];
    const T = p => [ox + p[0] * s, oy + p[1] * s];
    const P = T(map.P), A = T(map.A), B = T(map.B);
    const off = o.off || 22;
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const mh = mid(P, A), mv = mid(P, B), my = mid(A, B);
    const bottom = c[0] === 'b', left = c[1] === 'l';
    const lh = { x: mh[0], y: mh[1] + (bottom ? off : -off) };
    const lv = { x: mv[0] + (left ? -off : off), y: mv[1] };
    let nx = my[0] - P[0], ny = my[1] - P[1]; const nl = Math.hypot(nx, ny) || 1;
    const ly = { x: my[0] + nx / nl * off, y: my[1] + ny / nl * off };
    const k = Math.max(9, Math.min(18, Math.min(tw, th) * 0.14));
    const dx = Math.sign(A[0] - P[0]), dy = Math.sign(B[1] - P[1]);
    const lab = o.labels || {};
    const cls = side => 'side' + (o.hl === side ? ' hl' : '');
    let svg = `<svg class="viz tri" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(o.aria || 'Segitiga siku-siku')}">`;
    svg += `<polygon class="tri-fill" points="${P} ${A} ${B}"/>`;
    svg += `<line class="${cls('h')}" data-side="h" x1="${P[0]}" y1="${P[1]}" x2="${A[0]}" y2="${A[1]}"/>`;
    svg += `<line class="${cls('v')}" data-side="v" x1="${P[0]}" y1="${P[1]}" x2="${B[0]}" y2="${B[1]}"/>`;
    svg += `<line class="${cls('hyp')} hyp" data-side="hyp" x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"/>`;
    if (o.mark !== false) svg += `<path class="rmark" d="M${P[0] + dx * k},${P[1]} L${P[0] + dx * k},${P[1] + dy * k} L${P[0]},${P[1] + dy * k}"/>`;
    if (o.angleText) svg += `<text class="vlab small" x="${P[0] + dx * (k + 14)}" y="${P[1] + dy * (k + 6) + 4}" text-anchor="middle">90°</text>`;
    const t = (p, txt, side) => txt == null || txt === '' ? '' : `<text class="vlab${o.hl === side ? ' hl' : ''}" x="${p.x}" y="${p.y + 5}" text-anchor="middle">${esc(txt)}</text>`;
    svg += t(lh, lab.h, 'h') + t(lv, lab.v, 'v') + t(ly, lab.hyp, 'hyp');
    svg += (o.extra || '') + '</svg>';
    const far = o.slotOff || 0;
    return { svg, W, Hh, P, A, B, pts: { h: lh, v: lv, hyp: ly }, s };
  };

  /* ---------- Segitiga dengan persegi pada ketiga sisi ----------
     a: sisi tegak, b: sisi alas. Sudut siku-siku di kiri-bawah.
     o: {w,h, grid:true, anim:true, show:{a,b,c}, labels:true}                         */
  V.squares = function (a, b, o) {
    o = o || {};
    const c = Math.hypot(a, b);
    // koordinat satuan (y ke bawah), sudut siku-siku di (0,0)
    const Pp = [0, 0], T = [0, -a], R = [b, 0];
    const n = [a, -b];                       // normal luar sisi miring dengan panjang c
    const sqA = [T, Pp, [-a, 0], [-a, -a]];  // persegi pada sisi tegak (ke kiri)
    const sqB = [Pp, R, [b, b], [0, b]];     // persegi pada sisi alas (ke bawah)
    const sqC = [T, R, [R[0] + n[0], R[1] + n[1]], [T[0] + n[0], T[1] + n[1]]];
    const all = [...sqA, ...sqB, ...sqC];
    const minX = Math.min(...all.map(p => p[0])), maxX = Math.max(...all.map(p => p[0]));
    const minY = Math.min(...all.map(p => p[1])), maxY = Math.max(...all.map(p => p[1]));
    const W = o.w || 420, Hh = o.h || 380, m = o.m || 12;
    const s = Math.min((W - 2 * m) / (maxX - minX), (Hh - 2 * m) / (maxY - minY));
    const ox = (W - (maxX - minX) * s) / 2 - minX * s, oy = (Hh - (maxY - minY) * s) / 2 - minY * s;
    const X = p => [ox + p[0] * s, oy + p[1] * s];
    const pts = poly => poly.map(X).map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
    const cen = poly => { const q = poly.map(X); return [q.reduce((t, p) => t + p[0], 0) / 4, q.reduce((t, p) => t + p[1], 0) / 4]; };
    const gridLines = (poly, L) => {
      if (!o.grid || L > 14 || Math.abs(L - Math.round(L)) > 1e-9) return '';
      const [p0, p1, , p3] = poly.map(X); let g = '';
      const N = Math.round(L);
      for (let i = 1; i < N; i++) {
        const k = i / N;
        g += `<line x1="${p0[0] + (p1[0] - p0[0]) * k}" y1="${p0[1] + (p1[1] - p0[1]) * k}" x2="${p3[0] + (p1[0] - p0[0]) * k}" y2="${p3[1] + (p1[1] - p0[1]) * k}"/>`;
        g += `<line x1="${p0[0] + (p3[0] - p0[0]) * k}" y1="${p0[1] + (p3[1] - p0[1]) * k}" x2="${p1[0] + (p3[0] - p1[0]) * k}" y2="${p1[1] + (p3[1] - p1[1]) * k}"/>`;
      }
      return `<g class="grid">${g}</g>`;
    };
    const sh = o.show || { a: true, b: true, c: true };
    const one = (poly, L, cls, name, area) => {
      if (!sh[name]) return '';
      const [cx, cy] = cen(poly);
      const fs = Math.max(11, Math.min(18, L * s * 0.32));
      return `<g class="sqg ${o.anim ? 'pop' : ''}" data-sq="${name}" style="--d:${name === 'a' ? 0 : name === 'b' ? 0.5 : 1}s">
        <polygon class="sq ${cls}" points="${pts(poly)}"/>${gridLines(poly, L)}
        ${o.labels === false ? '' : `<text class="sqtxt" x="${cx}" y="${cy - 2}" text-anchor="middle" style="font-size:${fs}px">${name}² = ${f(area)}</text>
        <text class="sqtxt sub" x="${cx}" y="${cy + fs}" text-anchor="middle" style="font-size:${fs * 0.72}px">sisi ${f(L)}</text>`}</g>`;
    };
    const [Pq, Tq, Rq] = [X(Pp), X(T), X(R)];
    const k = Math.max(8, Math.min(16, Math.min(a, b) * s * 0.18));
    let svg = `<svg class="viz sqv" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Segitiga siku-siku dengan persegi pada ketiga sisinya: a = ${f(a)}, b = ${f(b)}, c = ${f(c)}">`;
    svg += one(sqA, a, 'sq-a', 'a', a * a) + one(sqB, b, 'sq-b', 'b', b * b) + one(sqC, c, 'sq-c', 'c', c * c);
    svg += `<polygon class="tri-fill" points="${Pq} ${Tq} ${Rq}"/>`;
    svg += `<path class="rmark" d="M${Pq[0] + k},${Pq[1]} L${Pq[0] + k},${Pq[1] - k} L${Pq[0]},${Pq[1] - k}"/>`;
    svg += `<polygon class="tri-line" points="${Pq} ${Tq} ${Rq}"/></svg>`;
    return { svg, a, b, c };
  };

  /* ---------- Pembuktian: persegi (a+b)² dengan 4 segitiga ---------- */
  V.proof = function (mode) {
    const S = 220, a = 70, b = 150, W = 260, Hh = 260, o = 20;
    // mode 'a' = persegi miring c di tengah; mode 'b' = dua persegi a² dan b² + dua persegi panjang ab
    let svg = `<svg class="viz proof" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Pembuktian Pythagoras dengan persegi (a + b) dikali (a + b)">`;
    const x0 = o, y0 = o;
    svg += `<rect class="pf-frame" x="${x0}" y="${y0}" width="${a + b}" height="${a + b}"/>`;
    if (mode === 'a') {
      const p1 = [x0 + b, y0], p2 = [x0 + a + b, y0 + b], p3 = [x0 + a, y0 + a + b], p4 = [x0, y0 + a];
      svg += `<polygon class="sq sq-c" points="${p1} ${p2} ${p3} ${p4}"/>`;
      const tri = (A, B, C) => `<polygon class="tri-fill" points="${A} ${B} ${C}"/>`;
      svg += tri([x0, y0], p1, p4) + tri(p1, [x0 + a + b, y0], p2) + tri(p2, [x0 + a + b, y0 + a + b], p3) + tri(p3, [x0, y0 + a + b], p4);
      svg += `<text class="sqtxt" x="${x0 + (a + b) / 2}" y="${y0 + (a + b) / 2 + 6}" text-anchor="middle" style="font-size:18px">c²</text>`;
      svg += `<text class="vlab small" x="${x0 + b / 2}" y="${y0 - 6}" text-anchor="middle">b</text><text class="vlab small" x="${x0 + b + a / 2}" y="${y0 - 6}" text-anchor="middle">a</text>`;
    } else {
      svg += `<rect class="sq sq-b" x="${x0}" y="${y0}" width="${b}" height="${b}"/><rect class="sq sq-a" x="${x0 + b}" y="${y0 + b}" width="${a}" height="${a}"/>`;
      svg += `<rect class="tri-fill" x="${x0 + b}" y="${y0}" width="${a}" height="${b}"/><rect class="tri-fill" x="${x0}" y="${y0 + b}" width="${b}" height="${a}"/>`;
      svg += `<line class="tri-line" x1="${x0 + b}" y1="${y0}" x2="${x0 + b}" y2="${y0 + b}"/><line class="tri-line" x1="${x0 + b}" y1="${y0}" x2="${x0 + a + b}" y2="${y0 + b}"/>`;
      svg += `<line class="tri-line" x1="${x0}" y1="${y0 + b}" x2="${x0 + b}" y2="${y0 + a + b}"/>`;
      svg += `<text class="sqtxt" x="${x0 + b / 2}" y="${y0 + b / 2 + 6}" text-anchor="middle" style="font-size:18px">b²</text><text class="sqtxt" x="${x0 + b + a / 2}" y="${y0 + b + a / 2 + 6}" text-anchor="middle" style="font-size:16px">a²</text>`;
      svg += `<text class="sqtxt" x="${x0 + b + a / 2}" y="${y0 + b / 2 + 4}" text-anchor="middle" style="font-size:14px">ab</text><text class="sqtxt" x="${x0 + b / 2}" y="${y0 + b + a / 2 + 5}" text-anchor="middle" style="font-size:14px">ab</text>`;
    }
    return svg + '</svg>';
  };

  /* ---------- Ilustrasi penerapan (Materi 5) ---------- */
  V.app = function (kind) {
    const ground = '<rect class="ground" x="0" y="196" width="400" height="44"/>';
    const sky = '<rect class="skyr" x="0" y="0" width="400" height="196"/>';

    if (kind === 'ladder') {                       // dinding 12 m, kaki tangga 5 m (12,5 px per m)
      const s = 12.5, wx = 300, top = 196 - 12 * s, fx = wx - 5 * s;

        <rect class="wall" x="${wx}" y="30" width="60" height="166"/><rect class="winn" x="${wx + 14}" y="${top - 12}" width="30" height="26"/>
        <line class="ladder" x1="${fx}" y1="196" x2="${wx}" y2="${top}"/>
        <line class="side" x1="${fx}" y1="196" x2="${wx}" y2="196"/><line class="side" x1="${wx}" y1="196" x2="${wx}" y2="${top}"/>
        <path class="rmark" d="M${wx - 12},196 L${wx - 12},184 L${wx},184"/>
        ${L('5 m', (fx + wx) / 2, 216)}${L('12 m', wx - 8, (196 + top) / 2 + 4, 'end')}${L('tangga = ?', (fx + wx) / 2 - 36, (196 + top) / 2 - 8)}</svg>`;
    }
    if (kind === 'field') {                        // 40 m x 30 m, skala 6 px per m
      const s = 6, x0 = 70, y0 = 200 - 30 * s, x1 = x0 + 40 * s;
      return `<svg class="viz app" viewBox="0 0 400 240" role="img" aria-label="Diagonal lapangan persegi panjang">
        <rect class="grass" x="0" y="0" width="400" height="240"/><rect class="field" x="${x0}" y="${y0}" width="${40 * s}" height="${30 * s}"/>
        <line class="side" x1="${x0}" y1="200" x2="${x1}" y2="200"/><line class="side" x1="${x1}" y1="${y0}" x2="${x1}" y2="200"/>
        <line class="side hyp" x1="${x0}" y1="200" x2="${x1}" y2="${y0}"/><path class="rmark" d="M${x1 - 12},200 L${x1 - 12},188 L${x1},188"/>
        ${L('40 m', (x0 + x1) / 2, 222)}${L('30 m', x1 + 8, (y0 + 200) / 2 + 4, 'start')}${L('diagonal = ?', (x0 + x1) / 2 - 26, (y0 + 200) / 2 - 6)}</svg>`;
    }
    if (kind === 'dist') {                         // A(1,1) dan B(7,7), 22 px per satuan, titik asal (40,220)
      const u = 22, ox = 40, oy = 220, X = v => ox + v * u, Y = v => oy - v * u;
      let gr = ''; for (let i = 0; i <= 15; i++) gr += `<line class="gridl" x1="${X(i)}" y1="20" x2="${X(i)}" y2="${oy}"/>`;
      for (let i = 0; i <= 9; i++) gr += `<line class="gridl" x1="${ox}" y1="${Y(i)}" x2="${X(15)}" y2="${Y(i)}"/>`;
      return `<svg class="viz app" viewBox="0 0 400 240" role="img" aria-label="Jarak dua titik pada bidang koordinat">
        <rect class="paper" x="0" y="0" width="400" height="240"/>${gr}
        <line class="side" x1="${X(1)}" y1="${Y(1)}" x2="${X(7)}" y2="${Y(1)}"/><line class="side" x1="${X(7)}" y1="${Y(1)}" x2="${X(7)}" y2="${Y(7)}"/>
        <line class="side hyp" x1="${X(1)}" y1="${Y(1)}" x2="${X(7)}" y2="${Y(7)}"/><path class="rmark" d="M${X(7) - 11},${Y(1)} L${X(7) - 11},${Y(1) - 11} L${X(7)},${Y(1) - 11}"/>
        <circle class="pt" cx="${X(1)}" cy="${Y(1)}" r="5"/><circle class="pt" cx="${X(7)}" cy="${Y(7)}" r="5"/>
        ${L('A(1, 1)', X(1) - 4, Y(1) + 18, 'middle')}${L('B(7, 7)', X(7) + 8, Y(7) - 2, 'start')}${L('6 satuan', (X(1) + X(7)) / 2 + 20, Y(1) + 16)}${L('6 satuan', X(7) + 8, (Y(1) + Y(7)) / 2 + 4, 'start')}${L('AB = ?', (X(1) + X(7)) / 2 - 24, (Y(1) + Y(7)) / 2 - 6)}</svg>`;
    }
    // gedung: tinggi 15 m, jarak 8 m, 10 px per m
    const s = 10, bx = 142, top = 196 - 15 * s, ex = bx + 8 * s;
    return `<svg class="viz app" viewBox="0 0 400 240" role="img" aria-label="Tinggi dan jarak sebuah bangunan">${sky}${ground}
      <rect class="wall" x="90" y="${top}" width="52" height="${196 - top}"/><rect class="winn" x="104" y="${top + 16}" width="12" height="14"/><rect class="winn" x="118" y="${top + 16}" width="12" height="14"/><rect class="winn" x="104" y="${top + 42}" width="12" height="14"/><rect class="winn" x="118" y="${top + 42}" width="12" height="14"/>
      <line class="side" x1="${bx}" y1="196" x2="${ex}" y2="196"/><line class="side" x1="${bx}" y1="196" x2="${bx}" y2="${top}"/>
      <line class="side hyp" x1="${bx}" y1="${top}" x2="${ex}" y2="196"/><path class="rmark" d="M${bx + 12},196 L${bx + 12},184 L${bx},184"/>
      <circle class="pt" cx="${ex}" cy="196" r="6"/>
      ${L('15 m', bx + 8, (196 + top) / 2 + 4, 'start')}${L('8 m', (bx + ex) / 2, 216)}${L('jarak pandang = ?', ex + 12, (196 + top) / 2 - 8, 'start')}</svg>`;
  };

  /* ---------- Adegan Game C ----------
     return {svg, from:[x,y], to:[x,y]} dalam viewBox 400x240; hero bergerak dari from ke to */
  V.scene = function (sc, built) {
    const unit = sc.unit;
    const sky = '<rect class="skyr" x="0" y="0" width="400" height="240"/>';
    const L = (t, x, y, an) => `<text class="vlab small" x="${x}" y="${y}" text-anchor="${an || 'middle'}">${t}</text>`;

    let svg, from, to;

      const h = sc.legs[0], b = sc.legs[1], s = Math.min(150 / h, 170 / b), wx = 320, top = 200 - h * s, fx = wx - b * s;

        ${built ? `<line class="ladder" x1="${fx}" y1="200" x2="${wx}" y2="${top}"/>` : `<line class="ladder ghost" x1="${fx}" y1="200" x2="${wx}" y2="${top}"/>`}
        <line class="side" x1="${fx}" y1="200" x2="${wx}" y2="200"/><line class="side" x1="${wx}" y1="200" x2="${wx}" y2="${top}"/>
        <path class="rmark" d="M${wx - 12},200 L${wx - 12},188 L${wx},188"/>${L(b + ' ' + unit, (fx + wx) / 2, 222)}${L(h + ' ' + unit, wx - 26, (200 + top) / 2)}${L('tangga = ?', (fx + wx) / 2 - 26, (200 + top) / 2 - 10)}`;
      from = [fx, 200]; to = [wx - 6, top + 4];
    } else if (sc.kind === 'bridge') {
      const dh = sc.legs[0], gap = sc.legs[1], s = Math.min(150 / gap, 80 / dh), gx = 140, yL = 100, xR = gx + gap * s, yR = yL + dh * s;
      svg = `${sky}<rect class="water" x="${gx}" y="${yR + 10}" width="${gap * s}" height="${240 - yR - 10}"/>
        <rect class="cliff" x="0" y="${yL}" width="${gx}" height="${240 - yL}"/><rect class="cliff" x="${xR}" y="${yR}" width="${400 - xR}" height="${240 - yR}"/>
        ${built ? `<line class="plank" x1="${gx}" y1="${yL}" x2="${xR}" y2="${yR}"/>` : `<line class="plank ghost" x1="${gx}" y1="${yL}" x2="${xR}" y2="${yR}"/>`}
        <line class="side" x1="${gx}" y1="${yL}" x2="${xR}" y2="${yL}"/><line class="side" x1="${xR}" y1="${yL}" x2="${xR}" y2="${yR}"/>
        <path class="rmark" d="M${xR - 12},${yL} L${xR - 12},${yL + 12} L${xR},${yL + 12}"/>
        ${L(gap + ' ' + unit, (gx + xR) / 2, yL - 8)}${L(dh + ' ' + unit, xR + 8, (yL + yR) / 2 + 4, 'start')}${L('papan = ?', (gx + xR) / 2 - 6, (yL + yR) / 2 + 22)}`;
      from = [gx, yL]; to = [xR, yR];
    } else if (sc.kind === 'pole') {
      const tower = sc.skin === 'tower';
      const known = sc.ask === 'leg' ? sc.hypLen : null;
      const hgt = sc.ask === 'leg' ? sc.ans : sc.legs[0], dist = sc.legs[1];
      const s = Math.min(150 / hgt, 190 / dist), px = 80, top = 205 - hgt * s, qx = px + dist * s;
      svg = `${sky}<rect class="ground" x="0" y="205" width="400" height="35"/>
        <rect class="${tower ? 'tower' : 'pole'}" x="${px - (tower ? 7 : 3)}" y="${top}" width="${tower ? 14 : 6}" height="${205 - top}"/>${tower ? '' : `<path class="flag" d="M${px + 3},${top} l26,8 l-26,8 z"/>`}
        ${built ? `<line class="rope" x1="${px}" y1="${top}" x2="${qx}" y2="205"/>` : `<line class="rope ghost" x1="${px}" y1="${top}" x2="${qx}" y2="205"/>`}
        <circle class="pt" cx="${qx}" cy="205" r="5"/><line class="side" x1="${px}" y1="205" x2="${qx}" y2="205"/>
        <path class="rmark" d="M${px + 12},205 L${px + 12},193 L${px},193"/>
        ${L(dist + ' ' + unit, (px + qx) / 2, 226)}${sc.ask === 'leg' ? L('tinggi = ?', px - 6, (205 + top) / 2, 'end') : L(sc.legs[0] + ' ' + unit, px - 12, (205 + top) / 2, 'end')}
        ${L((tower ? 'kabel' : 'tali') + ' = ' + (sc.ask === 'hyp' ? '?' : sc.hypLen + ' ' + unit), (px + qx) / 2 + 14, (205 + top) / 2 - 12)}`;

    } else {                                  // field
