  function markSeen(id) {
    if (!S.data.materiSeen[id]) { S.data.materiSeen[id] = Date.now(); S.save(); S.addXP(5, true); S.checkBadges(); }
  }

  /* ---------- pecah isi materi menjadi slide agar muat satu layar ---------- */
  function splitGroups(el) {
    const groups = [[]];
    Array.from(el.children).forEach(n => {
      const g = groups[groups.length - 1], has = sel => g.some(x => x.matches(sel));
      const brk = g.length && (n.matches('h4') || n.matches('.note') || (n.matches('.two') && has('.two')) || (n.matches('.tbl-wrap') && has('.tool,.two')));
      if (brk) groups.push([]);
      groups[groups.length - 1].push(n);
    });
    return groups;
  }

  /* =====================================================
     PP.book — "buku" satu layar: tab + slide + tombol Sebelumnya/Berikutnya
     spec.pages: [{label,title,html,mount} | {lesson:'3b'}], spec.start: indeks halaman awal,
     spec.last: {label, route} tombol pada slide terakhir
     ===================================================== */
  PP.book = function (spec) {
    const pages = spec.pages;
    const lab = p => p.lesson ? p.lesson.toUpperCase() : p.label;
    const html = `<div class="wrap narrowish"><div class="book">
      <nav class="tabs" aria-label="Daftar halaman">${pages.map((p, i) => `<button class="tab" data-bk="${i}">${lab(p)}</button>`).join('')}</nav>
      <section class="panel book-card"><div class="bk-head"><h2 id="bkTitle"></h2></div><div class="bk-body" id="bkBody"></div>
        <div class="bk-foot"><button class="btn" id="bkPrev"><span>◀</span><span class="lab"> Sebelumnya</span></button><div class="dots" id="bkDots"></div><button class="btn green" id="bkNext"><span class="lab">Berikutnya </span><span>▶</span></button></div></section></div></div>`;
    const inst = { html };
    inst.mount = function (root) {
      const body = PP.$('#bkBody', root), slides = [];
      pages.forEach((p, pi) => {
        if (p.lesson) {
          const part = PP.materiParts(p.lesson), host = document.createElement('div');
          host.className = 'lesson-body'; host.dataset.mid = p.lesson; host.innerHTML = part.body; host.hidden = true; body.appendChild(host);
          try { part.mount && part.mount(host); } catch (e) { console.error(e); }
          const groups = splitGroups(host).filter(g => g.length);
          groups.forEach((g, gi) => {
            const el = document.createElement('div'); el.className = 'slide-pg lesson-body'; el.hidden = true;
            g.forEach(n => el.appendChild(n)); body.appendChild(el);
            slides.push({ el, page: pi, title: part.title + (groups.length > 1 ? ` (${gi + 1}/${groups.length})` : ''), lesson: p.lesson, gi, gn: groups.length });
          });
          host.remove();
        } else {
          const el = document.createElement('div'); el.className = 'slide-pg'; el.hidden = true; el.innerHTML = p.html; body.appendChild(el);
          try { p.mount && p.mount(el); } catch (e) { console.error(e); }
          slides.push({ el, page: pi, title: p.title, gi: 0, gn: 1 });
        }
      });
      let cur = -1;
      const firstOf = pi => slides.findIndex(s => s.page === pi);
      const show = i => {
        i = Math.max(0, Math.min(slides.length - 1, i));
        if (i === cur) return; cur = i;
        slides.forEach((s, k) => s.el.hidden = k !== i);
        const s = slides[i];
        if (s.lesson) markSeen(s.lesson);
        PP.$('#bkTitle', root).textContent = s.title;
        PP.$$('.tab', root).forEach((t, pi) => {
          t.classList.toggle('on', pi === s.page);
          const pg = pages[pi]; t.classList.toggle('seen', !!(pg.lesson && S.data.materiSeen[pg.lesson]));
          if (pi === s.page) t.scrollIntoView && t.scrollIntoView({ block: 'nearest', inline: 'center' });
        });
        const same = slides.filter(x => x.page === s.page);
        PP.$('#bkDots', root).innerHTML = same.length > 1 ? same.map(x => `<i class="${x === s ? 'on' : ''}"></i>`).join('') : '';
        const prev = PP.$('#bkPrev', root), next = PP.$('#bkNext', root), end = i === slides.length - 1;
        prev.disabled = i === 0; prev.classList.toggle('dis', i === 0);
        next.innerHTML = end && spec.last ? `<span class="lab">${spec.last.label}</span><span>▶</span>` : '<span class="lab">Berikutnya </span><span>▶</span>';
        next.dataset.end = end && spec.last ? '1' : '';
        body.scrollTop = 0; s.el.scrollTop = 0;
      };
      PP.$('#bkPrev', root).onclick = () => show(cur - 1);
      PP.$('#bkNext', root).onclick = e => { if (e.currentTarget.dataset.end) PP.go(spec.last.route); else show(cur + 1); };
      PP.$$('.tab', root).forEach((t, pi) => t.onclick = () => show(firstOf(pi)));
      show(firstOf(spec.start || 0));
    };
    return inst;
  };

  PP.screens.materi = function (arg) {
    const idx = Math.max(0, PP.MATERI_IDS.indexOf(arg));
    return PP.book({ pages: PP.MATERI_IDS.map(m => ({ lesson: m })), start: idx, last: { label: 'Ke Peta Petualangan', route: 'peta' } });
  };

  /* =====================================================
     EKSPLORASI INTERAKTIF
     ===================================================== */
  PP.screens.eksplorasi = function () {
    return {
      html: `<div class="wrap narrowish"><div class="panel fill pad"><h2 class="h-title">Eksplorasi Pythagoras</h2>
        <p>Geser pengaturan sisi a (tegak) dan b (alas). Segitiga, sisi miring, dan luas persegi berubah otomatis.</p>
        <div class="ex-wrap"><div class="figure"><div id="exFig"></div></div>
          <div class="ex-ctl">
            <label class="slide"><span>Sisi tegak a</span><input type="range" id="exA" min="1" max="20" step="0.5" value="3"><input type="number" id="exAn" min="1" max="20" step="0.5" value="3"></label>
            <label class="slide"><span>Sisi alas b</span><input type="range" id="exB" min="1" max="20" step="0.5" value="4"><input type="number" id="exBn" min="1" max="20" step="0.5" value="4"></label>
            <p class="err" id="exErr" hidden></p>
            <div class="chips" id="exPre"><button class="chip" data-a="3" data-b="4">3 · 4</button><button class="chip" data-a="5" data-b="12">5 · 12</button><button class="chip" data-a="8" data-b="15">8 · 15</button><button class="chip" data-a="6" data-b="8">6 · 8</button><button class="chip" data-a="1" data-b="1">1 · 1</button></div>
            <div class="calc" id="exCalc"></div></div></div>
        <div class="tip">${PP.img('owl_1', 'tip-i')}<span>Tantangan: temukan a dan b sehingga c bilangan bulat. Itulah triple Pythagoras!</span></div></div></div>`,
      mount(root) {
        const R = id => PP.$(id, root); let changes = 0;
        const read = (id) => { const v = parseFloat(String(R(id).value).replace(',', '.')); return v; };
        const draw = () => {
          let a = read('#exAn'), b = read('#exBn'); const err = R('#exErr');
          if (!(a >= 1 && a <= 20 && b >= 1 && b <= 20)) { err.hidden = false; err.textContent = 'Isi a dan b dengan angka antara 1 dan 20.'; return; }
          err.hidden = true;
          const c = Math.hypot(a, b), tri = Math.abs(c - Math.round(c)) < 1e-9;
          R('#exFig').innerHTML = V.squares(a, b, { w: 460, h: 420 }).svg;
          R('#exCalc').innerHTML = `<div class="cl"><span class="dot sq-a"></span>a² = ${f(a)}² = <b>${f(a * a)}</b></div><div class="cl"><span class="dot sq-b"></span>b² = ${f(b)}² = <b>${f(b * b)}</b></div>
            <div class="cl sum">c² = a² + b² = ${f(a * a)} + ${f(b * b)} = <b>${f(a * a + b * b)}</b></div><div class="cl"><span class="dot sq-c"></span>c = √${f(a * a + b * b)} = <b>${f(c)}</b></div>
            ${tri && Number.isInteger(a) && Number.isInteger(b) ? `<div class="cl ok">Triple Pythagoras: ${Math.min(a, b)}, ${Math.max(a, b)}, ${c}</div>` : ''}`;
        };
        const set = (a, b) => { ['A', 'B'].forEach((k, i) => { const v = i ? b : a; R('#ex' + k).value = v; R('#ex' + k + 'n').value = v; }); draw(); };
        ['A', 'B'].forEach(k => {
          R('#ex' + k).addEventListener('input', e => { R('#ex' + k + 'n').value = e.target.value; draw(); bump(); });
          R('#ex' + k + 'n').addEventListener('input', e => { const v = parseFloat(String(e.target.value).replace(',', '.')); if (v >= 1 && v <= 20) R('#ex' + k).value = v; draw(); bump(); });
        });
        R('#exPre').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) { set(+c.dataset.a, +c.dataset.b); bump(); } });
        const bump = () => { changes++; if (changes === 6) { S.data.explored++; S.save(); S.award('explorer'); S.addXP(10); } };
        draw();
      }
    };
  };
})();

</script>
<script>
/* =========================================================
   GAME EDUKASI: A Susun Segitiga · B Temukan Panjang Sisi · C Misi Jembatan · D Tantangan Akhir
   ========================================================= */
(function () {
  const S = PPStore, A = PPAudio, V = PPViz, f = V.fmt;
  PP.screens = PP.screens || {};
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
  const CORNERS = ['bl', 'br', 'tl', 'tr'];

  const META = {
    A: { name: 'Susun Segitiga', desc: 'Seret atau ketuk nama sisi ke tempat yang tepat pada segitiga siku-siku.', how: ['Ada 5 ronde. Tiap ronde memiliki satu segitiga.', 'Seret kartu nama ke sisi yang sesuai. Di HP, ketuk kartu lalu ketuk sisinya.', 'Tekan Periksa. Skor dihitung dari jawaban pada pemeriksaan pertama.'], bgm: 'Musik: Minigame 1' },
    B: { name: 'Temukan Panjang Sisi', desc: 'Hitung sisi ketiga segitiga siku-siku. 10 soal dari mudah sampai sulit.', how: ['Dua panjang sisi diketahui, carilah sisi ketiga.', 'Kamu punya 2 kesempatan tiap soal. Setelah salah pertama, rumus akan dibantu.', 'Jawaban benar pertama bernilai 10, kedua bernilai 5.'], bgm: 'Musik: Minigame 1' },
    C: { name: 'Misi Jembatan', desc: 'Hitung panjang tangga, tali, atau jembatan agar penjelajah bisa melewati rintangan.', how: ['Ada 6 rintangan. Baca ceritanya lalu pilih jawaban yang benar.', 'Jawaban benar membuat jembatan terbentuk dan karakter melanjutkan perjalanan.', 'Salah pertama boleh mencoba sekali lagi.'], bgm: 'Musik: Minigame 2 (Race)' },
    D: { name: 'Tantangan Akhir', desc: 'Soal campuran dari seluruh materi. Kamu punya tiga nyawa.', how: ['10 soal acak dari seluruh materi.', 'Setiap jawaban salah mengurangi satu nyawa. Nyawa habis, permainan berakhir.', 'Setiap jawaban benar bernilai 10.'], bgm: 'Musik: Minigame 2 (Race)' }
  };

  /* ---------- menu game ---------- */
  PP.screens.games = function () {
    const cards = ['A', 'B', 'C', 'D'].map(k => {
      const g = S.data.games[k], pos = PP.POS.find(p => p.game === k), m = META[k];
      const st = S.missionDone(pos.id) ? 'selesai' : S.missionUnlocked(pos.id) ? 'terbuka' : 'terkunci';
      return `<div class="panel game-card"><div class="gc-top"><span class="gc-l">${k}</span><div><h3>${m.name}</h3><p class="small muted">Misi Pos ${pos.id} (${st})</p></div></div>
        <p class="desc">${m.desc}</p>
        <div class="gc-stat">${g ? PP.stars(g.stars) + `<span class="pill">Terbaik ${g.best}</span><span class="pill">${g.plays}×</span>` : '<span class="muted small">Belum dimainkan</span>'}</div>
        <button class="btn green sm" data-go="game-${k}">Main Game ${k}</button></div>`;
    }).join('');
    return { html: `<div class="wrap"><div class="panel pad-s" style="flex:none"><h2 class="h-title" style="margin:0">Game dan Tantangan</h2></div><div class="game-grid">${cards}</div></div>` };
  };

  /* ---------- pembungkus game ---------- */
  PP.screens.game = function (arg) {
    const k = META[arg] ? arg : 'A', m = META[k];
    const posId = (PP.POS.find(p => p.game === k) || {}).id;
    const html = `<div class="wrap narrowish"><div class="panel gshell">
      <div class="g-head"><span class="gc-l">${k}</span><h2 class="h-title">${m.name}</h2><span class="pill" id="gInfo"></span></div>
      <div id="gbox"></div></div></div>`;
    const inst = { html, timers: [], unmount() { this.timers.forEach(t => { clearInterval(t); clearTimeout(t); cancelAnimationFrame(t); }); } };
    inst.mount = function (root) {
      const box = PP.$('#gbox', root), info = PP.$('#gInfo', root);
      const ctx = { box, info, inst, k, posId };
      const intro = () => {
        box.innerHTML = `<div class="intro"><p>${m.desc}</p><ol class="how sm">${m.how.map(h => `<li><div><p>${h}</p></div></li>`).join('')}</ol>
          <p class="small muted">${m.bgm}</p>
          <div class="row center"><button class="btn xl green" id="gStart">MULAI</button><button class="btn" data-go="games">Pilih Game Lain</button></div></div>`;
        info.textContent = '';
        PP.$('#gStart').onclick = () => { A.sfx('start'); RUN[k](ctx, intro); };
      };
      intro();
    };
    return inst;
  };

  function finishGame(ctx, res, again) {
    const { box, k, posId } = ctx;
    const stars = S.recordGame(k, res);
    const unlocked = posId && S.missionUnlocked(posId), wasDone = posId && S.missionDone(posId);
    let note = '', modal = null;
    if (stars >= 1 && posId && unlocked) {
      const first = S.completeMission(posId, stars);
      note = `<p class="fb ok"><b>Misi Pos ${posId} ${first ? 'selesai!' : 'diperbarui.'}</b> ${PP.POS[posId - 1].name}</p>`;
      if (first) modal = { title: PP.POS[posId - 1].name + ' selesai!', stars, xp: 50 + 10 * stars, unlock: PP.nextPlace(posId), actions: [{ label: 'Ke Peta', route: 'peta' }, { label: posId < 6 ? 'Pos Berikutnya' : 'Menuju FINISH', route: posId < 6 ? 'pos-' + (posId + 1) : 'finish', cls: 'green' }] };
    } else if (stars < 1) note = '<p class="fb no">Skor belum mencapai 50. Coba lagi untuk mendapat bintang pertama!</p>';
    else if (posId && !unlocked) note = `<p class="muted small">Skor tersimpan. Pos ${posId} belum terbuka, jadi misinya belum dihitung.</p>`;
    if (!modal) A.sfx(stars >= 1 ? 'star' : 'end');
    ctx.info.textContent = '';
    box.innerHTML = `<div class="result"><div class="res-stars">${PP.stars(stars)}</div><h3>${res.title || (stars >= 2 ? 'Hebat sekali!' : stars === 1 ? 'Bagus!' : 'Ayo coba lagi!')}</h3>
      <div class="fin-stats"><div><b>${res.score}</b><span>Skor</span></div><div><b>${res.correct}</b><span>Benar</span></div><div><b>${res.wrong}</b><span>Salah</span></div><div><b>+${Math.round(res.score / 4)}</b><span>XP</span></div></div>
      ${note}
      <div class="row center"><button class="btn green" id="gAgain">Main Lagi</button><button class="btn" data-go="${wasDone || (posId && S.missionDone(posId)) ? 'peta' : 'games'}">${posId && S.missionDone(posId) ? 'Ke Peta' : 'Menu Game'}</button><button class="btn" data-go="menu">Menu Utama</button></div></div>`;
    PP.$('#gAgain').onclick = again;
    if (stars >= 2) PP.ui.confetti(30);
    if (modal) setTimeout(() => PP.ui.missionComplete(modal), 400);
  }

  const feedback = (ok, text) => `<div class="fb ${ok ? 'ok' : 'no'}">${PP.img('owl_' + (ok ? 2 : 0), 'fbi')}<div><b>${PP.pick(ok ? PP.MSG.right : PP.MSG.wrong)}</b>${text ? `<p>${text}</p>` : ''}</div></div>`;

  /* =====================================================
     GAME A — SUSUN SEGITIGA
     ===================================================== */
  const NAMES = { h: 'Sisi alas', v: 'Sisi tegak', hyp: 'Sisi miring (hipotenusa)' };
  function gameA(ctx, back) {
    const { box, info } = ctx, ROUNDS = 5;
    let round = 0, correct = 0, wrong = 0;
    const dims = [[4, 3], [5, 3], [3, 4], [6, 4], [4, 5], [5, 4], [6, 3]];
    const used = [];
    const next = () => {
      if (round >= ROUNDS) return finishGame(ctx, { score: Math.round(correct / (ROUNDS * 3) * 100), correct, wrong }, () => gameA(ctx, back));
      round++; info.textContent = `Ronde ${round}/${ROUNDS}`;
      let d; do { d = dims[rnd(dims.length)]; } while (used.includes(d.join()) && used.length < dims.length); used.push(d.join());
      const corner = CORNERS[rnd(4)];
      const t = V.tri({ H: d[0], V: d[1], corner, labels: {}, w: 340, h: 250, m: 46, off: 34 });
      const placed = { h: null, v: null, hyp: null }; let sel = null, checked = false, firstDone = false;
      box.innerHTML = `<div class="gsplit"><div class="gl"><div class="figbox" style="--ar:${(t.W / t.Hh).toFixed(3)}">${t.svg}${['h', 'v', 'hyp'].map(s => `<button class="slot" data-side="${s}" style="left:${(t.pts[s].x / t.W * 100).toFixed(2)}%;top:${(t.pts[s].y / t.Hh * 100).toFixed(2)}%" aria-label="Tempat nama sisi">?</button>`).join('')}</div></div><div class="gr"><p class="small">Letakkan nama yang tepat pada setiap sisi. <b>Sisi alas</b> adalah kaki yang mendatar, <b>sisi tegak</b> kaki yang tegak.</p>
        <div class="tray" id="tray">${shuffle(['h', 'v', 'hyp']).map(s => `<button class="dchip" data-v="${s}" type="button">${NAMES[s]}</button>`).join('')}</div>
        <div id="gfb"></div><div class="row center"><button class="btn green" id="gChk" disabled>Periksa</button></div></div></div>`;
      const slots = PP.$$('.slot', box), chips = PP.$$('.dchip', box), chk = PP.$('#gChk');
      const refresh = () => {
        slots.forEach(sl => { const v = placed[sl.dataset.side]; sl.textContent = v ? NAMES[v] : '?'; sl.classList.toggle('filled', !!v); });
        chips.forEach(c => { c.classList.toggle('used', Object.values(placed).includes(c.dataset.v)); c.classList.toggle('sel', sel === c.dataset.v); });
        chk.disabled = checked || Object.values(placed).some(v => !v);
      };
      const place = (side, v) => {
        if (checked) return;
        Object.keys(placed).forEach(k => { if (placed[k] === v) placed[k] = null; });
        placed[side] = v; sel = null; A.sfx('tick'); PP.$$('.slot', box).forEach(s => s.classList.remove('bad')); refresh();
      };
      slots.forEach(sl => sl.addEventListener('click', () => {
        if (checked) return;
        if (sel) place(sl.dataset.side, sel);
        else if (placed[sl.dataset.side]) { placed[sl.dataset.side] = null; refresh(); }
      }));
      // seret & lepas (pointer) + ketuk
      const tray = PP.$('#tray', box); let drag = null;
      tray.addEventListener('pointerdown', e => {
        const c = e.target.closest('.dchip'); if (!c || c.classList.contains('used')) return;
        drag = { c, x: e.clientX, y: e.clientY, ghost: null }; try { c.setPointerCapture(e.pointerId); } catch (_) {}
      });
      tray.addEventListener('pointermove', e => {
        if (!drag) return;
        if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { drag.ghost = drag.c.cloneNode(true); drag.ghost.className = 'dchip ghost-chip'; document.body.appendChild(drag.ghost); }
        if (drag.ghost) {
          drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
          const el = document.elementFromPoint(e.clientX, e.clientY), sl = el && el.closest('.slot');
          slots.forEach(s => s.classList.toggle('over', s === sl));
        }
      });
      const endDrag = e => {
        if (!drag) return; const d = drag; drag = null; slots.forEach(s => s.classList.remove('over'));
        if (d.ghost) { d.ghost.remove(); const el = document.elementFromPoint(e.clientX, e.clientY), sl = el && el.closest('.slot'); if (sl && e.type === 'pointerup') place(sl.dataset.side, d.c.dataset.v); }
        else if (e.type === 'pointerup') { sel = sel === d.c.dataset.v ? null : d.c.dataset.v; A.sfx('tick'); refresh(); }
      };
      tray.addEventListener('pointerup', endDrag); tray.addEventListener('pointercancel', endDrag);
      tray.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('dchip') && !e.target.classList.contains('used')) { e.preventDefault(); sel = sel === e.target.dataset.v ? null : e.target.dataset.v; refresh(); } });
      chk.onclick = () => {
        const bad = Object.keys(placed).filter(s => placed[s] !== s), ok = 3 - bad.length;
        if (!firstDone) { firstDone = true; correct += ok; wrong += bad.length; S.tallyAnswer; if (ok) S.addXP(ok * 2, true); }
        if (!bad.length) {
          checked = true; A.sfx('correct'); refresh();
          PP.$('#gfb', box).innerHTML = feedback(true, 'Semua sisi sudah tepat. Sisi miring ada di depan sudut siku-siku.');
          chk.disabled = true; chk.insertAdjacentHTML('afterend', `<button class="btn green" id="gNext">${round >= ROUNDS ? 'Lihat Hasil' : 'Ronde Berikutnya'}</button>`);
          PP.$('#gNext').onclick = next;
        } else {
          A.sfx('wrong');
          slots.forEach(sl => { if (bad.includes(sl.dataset.side)) { sl.classList.add('bad'); placed[sl.dataset.side] = null; } });
          PP.$('#gfb', box).innerHTML = feedback(false, `${bad.length} sisi belum tepat. Sisi yang salah dikosongkan, coba tempatkan lagi. Petunjuk: sisi miring berada di depan sudut siku-siku.`);
          refresh();
        }
      };
      refresh();
    };
    next();
  }

  /* =====================================================
     GAME B — TEMUKAN PANJANG SISI
     ===================================================== */
  function expl(it) {
    const { a, b, c } = it;
    if (it.unk === 'c') return `c² = a² + b² = ${f(a)}² + ${f(b)}² = ${f(a * a)} + ${f(b * b)} = ${f(c * c)}, jadi c = √${f(c * c)} = ${f(c)}.`;
    if (it.unk === 'a') return `a² = c² − b² = ${f(c)}² − ${f(b)}² = ${f(c * c)} − ${f(b * b)} = ${f(a * a)}, jadi a = √${f(a * a)} = ${f(a)}.`;
    return `b² = c² − a² = ${f(c)}² − ${f(a)}² = ${f(c * c)} − ${f(a * a)} = ${f(b * b)}, jadi b = √${f(b * b)} = ${f(b)}.`;
  }
  const hintB = it => it.unk === 'c' ? 'Petunjuk: sisi miring dicari, jadi jumlahkan kuadrat kedua sisi siku-siku: c² = a² + b².' : 'Petunjuk: yang dicari sisi siku-siku, jadi kurangkan: kuadrat sisi miring dikurangi kuadrat sisi yang diketahui.';
  function gameB(ctx, back) {
    const { box, info } = ctx;
    const pick = (arr, n) => shuffle(arr).slice(0, n);
    const qs = [...pick(PP.POOL_B.easy, 4).map(x => ({ ...x, lv: 'Mudah' })), ...pick(PP.POOL_B.medium, 3).map(x => ({ ...x, lv: 'Sedang' })), ...pick(PP.POOL_B.hard, 3).map(x => ({ ...x, lv: 'Sulit' }))];
    let i = 0, pts = 0, correct = 0, wrong = 0;
    const next = () => {
      if (i >= qs.length) return finishGame(ctx, { score: Math.min(100, pts), correct, wrong }, () => gameB(ctx, back));
      const it = qs[i++]; info.textContent = `Soal ${i}/${qs.length} · ${it.lv}`;
      const lab = s => it.unk === s ? (s === 'a' ? 'a = ?' : s === 'b' ? 'b = ?' : 'c = ?') : `${s} = ${f(it[s])} cm`;
      const t = V.tri({ H: it.b, V: it.a, corner: CORNERS[rnd(4)], labels: { h: lab('b'), v: lab('a'), hyp: lab('c') }, w: 360, h: 250, m: 50, off: 22 });
      const unkName = { a: 'sisi tegak (a)', b: 'sisi alas (b)', c: 'sisi miring (c)' }[it.unk];
      box.innerHTML = `<div class="gsplit"><div class="gl"><div class="figure">${t.svg}</div></div><div class="gr"><p class="q-text">Tentukan panjang <b>${unkName}</b> dalam cm.</p>
        <form class="ans" id="gForm"><input id="gIn" class="cell big" inputmode="decimal" autocomplete="off" placeholder="Jawabanmu" aria-label="Jawaban"><button class="btn green" type="submit">Jawab</button></form>
        <p class="small muted">Boleh memakai koma desimal, misalnya 12,5.</p><div id="gfb"></div></div></div>`;
      let tries = 0; const inp = PP.$('#gIn', box); inp.focus();
      PP.$('#gForm', box).onsubmit = e => {
        e.preventDefault();
        const v = parseFloat(inp.value.replace(',', '.'));
        if (isNaN(v)) { PP.$('#gfb', box).innerHTML = '<p class="err">Tulis jawabanmu dengan angka.</p>'; return; }
        tries++;
        const ok = Math.abs(v - it[it.unk]) < 0.01;
        const fin = (good, got) => {
          inp.disabled = true; PP.$('#gForm button', box).disabled = true;
          if (good) { correct++; pts += got; S.tallyAnswer(true); S.addXP(5); } else { wrong++; S.tallyAnswer(false); }
          PP.$('#gfb', box).innerHTML = feedback(good, expl(it)) + `<button class="btn green" id="gNext">${i >= qs.length ? 'Lihat Hasil' : 'Soal Berikutnya'}</button>`;
          PP.$('#gNext').onclick = next; PP.$('#gNext').focus();
        };
        if (ok) { A.sfx('correct'); fin(true, tries === 1 ? 10 : 5); }
        else if (tries === 1) { A.sfx('wrong'); PP.$('#gfb', box).innerHTML = feedback(false, hintB(it) + ' Coba sekali lagi.'); inp.select(); }
        else { A.sfx('wrong'); fin(false, 0); }
      };
    };
    next();
  }

  /* =====================================================
     GAME C — MISI JEMBATAN
     ===================================================== */
  function explC(sc) {
    const [p, q] = sc.legs;
    if (sc.ask === 'hyp') return `Segitiga siku-siku dengan sisi ${p} dan ${q}. c² = ${p}² + ${q}² = ${p * p} + ${q * q} = ${p * p + q * q}, jadi c = √${p * p + q * q} = ${sc.ans} ${sc.unit}.`;
    return `Sisi miring ${sc.hypLen} dan satu sisi ${q}. t² = ${sc.hypLen}² − ${q}² = ${sc.hypLen ** 2} − ${q * q} = ${sc.hypLen ** 2 - q * q}, jadi t = √${sc.hypLen ** 2 - q * q} = ${sc.ans} ${sc.unit}.`;
  }
  function gameC(ctx, back) {
    const { box, info, inst } = ctx, me = PP.me();
    let i = 0, pts = 0, correct = 0, wrong = 0;
    const per = 100 / PP.SCENES_C.length;
    const next = () => {
      if (i >= PP.SCENES_C.length) return finishGame(ctx, { score: Math.round(pts), correct, wrong }, () => gameC(ctx, back));
      const sc = PP.SCENES_C[i++]; info.textContent = `Rintangan ${i}/${PP.SCENES_C.length}`;
      const g = V.scene(sc, false);
      box.innerHTML = `<div class="gsplit"><div class="gl"><h3 class="h-sub">${sc.title}</h3><div class="figure sceneF">${g.svg}</div><p class="small">${sc.story}</p></div><div class="gr"><p class="q-text"><b>${sc.q}</b></p>
        <div class="opts grid2">${sc.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="ol">${'ABCD'[k]}</span>${o}</button>`).join('')}</div><div id="gfb"></div></div></div>`;
      const hero = PP.$('#hero', box); hero.innerHTML = `<image id="heroImg" href="assets/img/${me.idle}.png" width="26" height="50" x="${g.from[0] - 13}" y="${g.from[1] - 50}"/>`;
      const img = PP.$('#heroImg', box); let tries = 0, done = false;
      const walk = () => {
        PP.$$('.ghost', box).forEach(n => n.classList.remove('ghost'));
        let fi = 0; const fr = me.walk; const ft = setInterval(() => { fi = (fi + 1) % fr.length; img.setAttribute('href', `assets/img/${fr[fi]}.png`); }, 140); inst.timers.push(ft);
        const t0 = performance.now(), dur = 1700;
        const step = now => {
          const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          img.setAttribute('x', g.from[0] + (g.to[0] - g.from[0]) * e - 13); img.setAttribute('y', g.from[1] + (g.to[1] - g.from[1]) * e - 50);
          if (k < 1) inst.timers.push(requestAnimationFrame(step)); else { clearInterval(ft); img.setAttribute('href', `assets/img/${me.idle}.png`); A.sfx('star'); showNext(); }
        };
        inst.timers.push(requestAnimationFrame(step));
      };
      const showNext = () => { PP.$('#gfb', box).insertAdjacentHTML('beforeend', `<button class="btn green" id="gNext">${i >= PP.SCENES_C.length ? 'Lihat Hasil' : 'Rintangan Berikutnya'}</button>`); PP.$('#gNext').onclick = next; PP.$('#gNext').focus(); };
      PP.$$('.opt', box).forEach(b => b.onclick = () => {
        if (done || b.disabled) return; tries++;
        const ok = sc.o[+b.dataset.k] === sc.ans + ' ' + sc.unit;
        if (ok) {
          done = true; PP.$$('.opt', box).forEach(x => x.disabled = true); b.classList.add('right'); A.sfx('correct');
          correct++; pts += tries === 1 ? per : per / 2; S.tallyAnswer(true); S.addXP(6);
          PP.$('#gfb', box).innerHTML = feedback(true, explC(sc)); walk();
        } else if (tries === 1) {
          b.classList.add('wrong'); b.disabled = true; A.sfx('wrong'); PP.$('#gfb', box).innerHTML = feedback(false, 'Ingat, gunakan Teorema Pythagoras pada segitiga siku-siku di gambar. Coba sekali lagi.');
        } else {
          done = true; wrong++; S.tallyAnswer(false); b.classList.add('wrong'); PP.$$('.opt', box).forEach(x => { x.disabled = true; if (sc.o[+x.dataset.k] === sc.ans + ' ' + sc.unit) x.classList.add('right'); });
          A.sfx('wrong'); PP.$('#gfb', box).innerHTML = feedback(false, explC(sc)); walk();
        }
      });
    };
    next();
  }

  /* =====================================================
     GAME D — TANTANGAN AKHIR
     ===================================================== */
  function gameD(ctx, back) {
    const { box, info } = ctx;
    const qs = shuffle(PP.POOL_D).slice(0, 10);
    let i = 0, lives = 3, correct = 0, wrong = 0, streak = 0;
    const hearts = () => Array.from({ length: 3 }, (_, k) => `<span class="heart ${k < lives ? '' : 'off'}">♥</span>`).join('');
    const end = (over) => finishGame(ctx, { score: correct * 10, correct, wrong, title: over ? 'Nyawa habis, tetap semangat!' : null }, () => gameD(ctx, back));
    const next = () => {
      if (i >= qs.length || lives <= 0) return end(lives <= 0);
      const q = qs[i++]; info.textContent = `Soal ${i}/${qs.length}`;
      box.innerHTML = `<div class="d-bar"><span class="hearts" aria-label="Nyawa ${lives}">${hearts()}</span><span class="pill">Skor ${correct * 10}</span>${streak >= 2 ? `<span class="pill ok">Beruntun ${streak}</span>` : ''}</div>
        <h3 class="q-text">${q.q}</h3><div class="opts grid2">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="ol">${'ABCD'[k]}</span>${o}</button>`).join('')}</div><div id="gfb"></div>`;
      PP.$$('.opt', box).forEach(b => b.onclick = () => {
        if (b.disabled) return; const ok = +b.dataset.k === q.a;
        PP.$$('.opt', box).forEach(x => x.disabled = true); b.classList.add(ok ? 'right' : 'wrong'); PP.$$('.opt', box)[q.a].classList.add('right');
        S.tallyAnswer(ok);
        if (ok) { correct++; streak++; S.addXP(5); A.sfx('correct'); } else { wrong++; streak = 0; lives--; A.sfx('wrong'); }
        PP.$('.hearts', box).innerHTML = hearts();
        PP.$('#gfb', box).innerHTML = feedback(ok, q.e) + `<button class="btn green" id="gNext">${(i >= qs.length || lives <= 0) ? 'Lihat Hasil' : 'Soal Berikutnya'}</button>`;
        PP.$('#gNext').onclick = next; PP.$('#gNext').focus();
      });
    };
    next();
  }

  const RUN = { A: gameA, B: gameB, C: gameC, D: gameD };
})();

</script>
<script>
/* =========================================================
   KUIS INTERAKTIF — 15 soal, timer dapat diatur, jawaban tersimpan, pembahasan
   ========================================================= */
(function () {
  const S = PPStore, A = PPAudio;
  PP.screens = PP.screens || {};
  const N = () => PP.QUIZ.length;

  function predikat(score) { return S.predikat(score); }
  function mmss(s) { s = Math.max(0, s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  PP.screens.kuis = function () {
    const inst = { timers: [], unmount() { this.timers.forEach(clearInterval); } };
    inst.html = '<div class="wrap narrowish"><div class="panel fill pad" id="qz"></div></div>';
    inst.mount = function (root) {
      const box = PP.$('#qz', root); const q = S.data.quiz;
      const draft = q.draft;
      const lv = PP.QUIZ.reduce((o, x) => (o[x.lv] = (o[x.lv] || 0) + 1, o), {});

      const intro = () => {
        const best = q.best;
        box.innerHTML = `<div class="qz-intro"><h2 class="h-title">Kuis Interaktif</h2>
          <p style="margin:0">${N()} soal pilihan ganda: ${Object.keys(lv).map(k => lv[k] + ' ' + k.toLowerCase()).join(', ')}. Satu soal tampil pada satu waktu, jawaban tersimpan otomatis, pembahasan muncul setelah selesai.</p>
          ${best ? `<p class="pill big">Nilai terbaik: ${best.score} · ${predikat(best.score).t}</p>` : ''}
          <label class="fld">Waktu pengerjaan
            <select id="qTime"><option value="0">Tanpa timer</option>${[5, 10, 15, 20, 30].map(m => `<option value="${m}" ${q.timerMin === m ? 'selected' : ''}>${m} menit</option>`).join('')}</select></label>
          <div class="row center">${draft ? '<button class="btn blue" id="qResume">Lanjutkan Kuis Sebelumnya</button>' : ''}<button class="btn green xl" id="qStart">${draft ? 'Mulai Baru' : 'MULAI KUIS'}</button></div></div>`;
        PP.$('#qTime').onchange = e => { q.timerMin = +e.target.value; S.save(); };
        PP.$('#qStart').onclick = () => { A.sfx('start'); run({ ans: Array(N()).fill(null), idx: 0, end: q.timerMin ? Date.now() + q.timerMin * 60000 : 0, min: q.timerMin }); };
        if (draft) PP.$('#qResume').onclick = () => run(draft);
      };

      const run = (st) => {
        const persist = () => { q.draft = st; S.save(); };
        persist();
        let timer = null;
        const finish = (auto) => {
          clearInterval(timer);
          const res = grade(st); q.draft = null; q.last = res; q.attempts++;
          if (!q.best || res.score > q.best.score) q.best = res;
          S.data.tally.correct += res.correct; S.data.tally.wrong += res.wrong + res.blank; S.save();
          S.addXP(res.correct * 3 + (res.score >= 80 ? 20 : 0), true);
          if (res.score >= 80) S.award('quiz80'); if (res.score >= 100) S.award('perfect');
          A.sfx(res.score >= 70 ? 'mission' : 'end'); if (res.score >= 70) PP.ui.confetti(40);
          result(res, auto);
        };
        const draw = () => {
          const it = PP.QUIZ[st.idx], sel = st.ans[st.idx], answered = st.ans.filter(a => a != null).length;
          box.innerHTML = `<div class="qz-top"><span class="pill">Soal ${st.idx + 1}/${N()}</span><span class="pill lv-${it.lv}">${it.lv}</span><span class="pill">Terjawab ${answered}/${N()}</span>${st.end ? `<span class="pill timer" id="qTimer">${mmss(Math.ceil((st.end - Date.now()) / 1000))}</span>` : '<span class="pill">Tanpa timer</span>'}</div>
            <div class="bar"><i style="width:${answered / N() * 100}%"></i></div>
            <h3 class="q-text">${it.q}</h3>
            <div class="opts grid2 qz-opts">${it.o.map((o, k) => `<button class="opt nosfx ${sel === k ? 'sel' : ''}" data-k="${k}"><span class="ol">${'ABCD'[k]}</span>${o}</button>`).join('')}</div>
            <nav class="qnav" aria-label="Nomor soal">${st.ans.map((a, k) => `<button class="qn nosfx ${k === st.idx ? 'cur' : ''} ${a != null ? 'done' : ''}" data-i="${k}" aria-label="Soal ${k + 1}${a != null ? ' sudah dijawab' : ''}">${k + 1}</button>`).join('')}</nav>
            <div class="row between"><button class="btn" id="qPrev" ${st.idx === 0 ? 'disabled' : ''}>◀ Sebelumnya</button><button class="btn sm gold" id="qDone2">Selesai</button>
              ${st.idx < N() - 1 ? '<button class="btn green" id="qNext">Berikutnya ▶</button>' : '<button class="btn blue" id="qDone">Kirim</button>'}</div>
`;
          PP.$$('.opt', box).forEach(b => b.onclick = () => { st.ans[st.idx] = +b.dataset.k; persist(); A.sfx('quizSelect'); draw(); });
          PP.$$('.qn', box).forEach(b => b.onclick = () => { st.idx = +b.dataset.i; persist(); A.sfx('tick'); draw(); });
          const go = d => () => { st.idx = Math.max(0, Math.min(N() - 1, st.idx + d)); persist(); draw(); };
          PP.$('#qPrev').onclick = go(-1); if (PP.$('#qNext')) PP.$('#qNext').onclick = go(1);
          const ask = () => {
            const blank = st.ans.filter(a => a == null).length;
            PP.ui.modal(`<h3>Selesaikan kuis?</h3><p class="modal-text">${blank ? blank + ' soal belum dijawab dan akan dihitung salah.' : 'Semua soal sudah terjawab.'} Setelah selesai, jawaban tidak dapat diubah.</p><div class="row end"><button class="btn" data-close>Kembali</button><button class="btn green" id="qOk">Ya, selesai</button></div>`);
            PP.$('#qOk').onclick = () => { PP.ui.close(); finish(false); };
          };
          if (PP.$('#qDone')) PP.$('#qDone').onclick = ask; if (PP.$('#qDone2')) PP.$('#qDone2').onclick = ask;
        };
        const tick = () => {
          if (!st.end) return;
          const left = Math.ceil((st.end - Date.now()) / 1000), t = PP.$('#qTimer');
          if (t) { t.textContent = mmss(left); t.classList.toggle('low', left <= 60); }
          if (left <= 0) { PP.ui.close(); PP.ui.toast('Waktu habis. Kuis diselesaikan otomatis.', 'owl'); finish(true); }
        };
        if (st.end) { timer = setInterval(tick, 1000); inst.timers.push(timer); }
        if (st.end && st.end - Date.now() <= 0) { finish(true); return; }
        draw();
      };

      const grade = st => {
        let correct = 0, wrong = 0, blank = 0;
        st.ans.forEach((a, i) => { if (a == null) blank++; else if (a === PP.QUIZ[i].a) correct++; else wrong++; });
        return { score: Math.round(correct / N() * 100), correct, wrong, blank, total: N(), ans: st.ans.slice(), date: Date.now() };
      };

      const result = (res, auto) => {
        const pr = predikat(res.score), stars = S.starsFor(res.score);
        let ri = 0;
        box.innerHTML = `<div class="result" style="display:flex;flex-direction:column;min-height:0;flex:1">
          <div class="qz-res-top"><div class="res-stars">${PP.stars(stars)}</div><div><h2 class="h-title" style="margin:0">Hasil Kuis</h2><p class="pill big" style="margin:0">${pr.t}</p></div></div>
          ${auto ? '<p class="fb no" style="margin:2px 0">Waktu habis, kuis diselesaikan otomatis.</p>' : ''}
          <div class="fin-stats"><div><b>${res.score}</b><span>Nilai</span></div><div><b>${res.correct}</b><span>Benar</span></div><div><b>${res.wrong}</b><span>Salah</span></div><div><b>${res.blank}</b><span>Kosong</span></div></div>
          <div class="rv-head"><b class="h-sub" style="margin:0">Pembahasan</b><span class="pill" id="rvPos"></span></div>
          <div class="review scrollbox" id="rvBox" style="flex:1"></div>
          <div class="row between" style="margin:4px 0 0"><button class="btn sm" id="rvPrev">◀</button><button class="btn green sm" id="qAgain">Ulangi Kuis</button><button class="btn sm" data-go="nilai">Penilaian</button><button class="btn sm" id="rvNext">▶</button></div></div>`;
        const drawRv = () => {
          const it = PP.QUIZ[ri], a = res.ans[ri], ok = a === it.a;
          PP.$('#rvPos').textContent = (ri + 1) + ' / ' + N();
          PP.$('#rvBox').innerHTML = `<article class="rv ${a == null ? 'blank' : ok ? 'ok' : 'no'}"><h4>${ri + 1}. ${it.q} <span class="pill lv-${it.lv}">${it.lv}</span></h4>
            <p class="small">Jawabanmu: <b>${a == null ? 'tidak dijawab' : 'ABCD'[a] + '. ' + it.o[a]}</b> ${ok ? '✓' : ''}</p>
            ${ok ? '' : `<p class="small">Kunci: <b>${'ABCD'[it.a]}. ${it.o[it.a]}</b></p>`}<p class="small">${it.e}</p></article>`;
          PP.$('#rvPrev').disabled = ri === 0; PP.$('#rvNext').disabled = ri === N() - 1;
        };
        PP.$('#rvPrev').onclick = () => { ri--; drawRv(); }; PP.$('#rvNext').onclick = () => { ri++; drawRv(); };
        drawRv();
        PP.$('#qAgain').onclick = intro;
      };
      intro();
    };
    return inst;
  };
})();

</script>
<script>
/* =========================================================
   VIDEO ANIMASI · REFLEKSI · PROGRAM PENILAIAN (laporan, CSV, cetak)
   ========================================================= */
(function () {
  const S = PPStore, A = PPAudio;
  PP.screens = PP.screens || {};
  const IN_VIEWER = !!window.claude;     // di dalam viewer artifact: unduh/cetak tidak tersedia

  /* =====================================================
     VIDEO
     ===================================================== */
  function ytId(u) { const m = String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/); return m ? m[1] : null; }
  const tm = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

  PP.screens.video = function () {
    const inst = { timers: [], objUrl: null, unmount() { if (this.objUrl) URL.revokeObjectURL(this.objUrl); } };
    inst.html = `<div class="wrap narrowish"><div class="panel fill pad"><h2 class="h-title" style="margin:0 0 4px">Video Animasi</h2>
      <div class="chips" id="vTabs">${PP.VIDEOS.map((v, i) => `<button class="chip ${i === 0 ? 'on' : ''}" data-i="${i}">Video ${i + 1}</button>`).join('')}</div><div id="vBox" class="scrollbox grow"></div></div></div>`;
    inst.mount = function (root) {
      const box = PP.$('#vBox', root); let cur = 0;
      const show = i => {
        cur = i; const v = PP.VIDEOS[i]; PP.$$('#vTabs .chip', root).forEach((c, k) => c.classList.toggle('on', k === i));
        if (inst.objUrl) { URL.revokeObjectURL(inst.objUrl); inst.objUrl = null; }
        const saved = S.data.videoUrls[v.id] || '', src = v.src || saved, yt = ytId(src);
        let stage;
        if (yt) stage = `<div class="vstage"><iframe src="https://www.youtube.com/embed/${yt}" title="${PP.esc(v.title)}" allow="fullscreen" allowfullscreen></iframe></div><p class="small muted">Video YouTube memakai kontrol bawaan YouTube dan membutuhkan koneksi internet.</p>`;
        else if (src) stage = `<div class="vstage"><video id="vid" preload="metadata" playsinline src="${PP.esc(src)}"></video></div>${controls()}<p class="err" id="vErr" hidden>Video tidak dapat dimuat. Periksa nama file atau tautan, lalu coba lagi.</p>`;
        else stage = `<div class="vstage ph"><div class="ph-in">${PP.img('ic_pause', 'ph-ic')}<b>Video belum tersedia</b><p>Guru dapat memasukkan video MP4 atau tautan video di bawah ini.</p></div></div>${controls(true)}`;
        box.innerHTML = `<h3 class="h-sub">${v.title}</h3>${stage}<p>${v.desc}</p>
          <details class="ap-det"><summary>Masukkan video (untuk guru)</summary>
            <label class="fld">Pilih file MP4 dari perangkat<input type="file" id="vFile" accept="video/mp4,video/webm"></label>
            <p class="small muted">File yang dipilih hanya dipakai pada sesi ini.</p>
            <label class="fld">Atau tempel tautan MP4 / YouTube<input type="url" id="vUrl" placeholder="https://..." value="${PP.esc(saved)}"></label>
            <div class="row"><button class="btn green sm" id="vSave">Simpan tautan</button><button class="btn sm" id="vClear">Hapus tautan</button></div>
            <p class="small muted">Tetap tersimpan: letakkan file di <code>assets/video/</code> lalu isi <code>src</code> pada <code>PP.VIDEOS</code> di <code>js/data.js</code>.</p><p class="err" id="vMsg" hidden></p></details>`;
        const vid = PP.$('#vid', box);
        if (vid) bind(vid);
        PP.$('#vFile', box).onchange = e => {
          const f = e.target.files[0]; if (!f) return;
          if (!/^video\//.test(f.type)) { const m = PP.$('#vMsg', box); m.hidden = false; m.textContent = 'File bukan video. Pilih file MP4.'; return; }
          inst.objUrl = URL.createObjectURL(f); PP.VIDEOS[i]._tmp = inst.objUrl;
          box.querySelector('.vstage').outerHTML = `<div class="vstage"><video id="vid" preload="metadata" playsinline src="${inst.objUrl}"></video></div>`;
          const old = PP.$('.vctl', box); if (old) old.remove();
          PP.$('.vstage', box).insertAdjacentHTML('afterend', controls()); bind(PP.$('#vid', box));
        };
        PP.$('#vSave', box).onclick = () => {
          const u = PP.$('#vUrl', box).value.trim(), m = PP.$('#vMsg', box);
          if (!/^https?:\/\//i.test(u) && !/^assets\//.test(u)) { m.hidden = false; m.textContent = 'Tautan harus diawali https://'; return; }
          S.data.videoUrls[v.id] = u; S.save(); PP.ui.toast('Tautan video tersimpan.'); show(i);
        };
        PP.$('#vClear', box).onclick = () => { delete S.data.videoUrls[v.id]; S.save(); show(i); };
      };
      const controls = dis => `<div class="vctl ${dis ? 'off' : ''}"><button class="btn sm" id="vPlay" ${dis ? 'disabled' : ''} aria-label="Putar">▶</button>
        <input type="range" id="vProg" min="0" max="1000" value="0" ${dis ? 'disabled' : ''} aria-label="Progres video"><span class="small" id="vTime">0:00 / 0:00</span>
        <button class="btn sm" id="vMute" ${dis ? 'disabled' : ''} aria-label="Bisukan">♪</button><input type="range" id="vVol" min="0" max="1" step="0.05" value="0.8" ${dis ? 'disabled' : ''} aria-label="Volume video"></div>`;
      const bind = vid => {
        const $ = id => PP.$(id, box); vid.volume = 0.8;
        $('#vPlay').onclick = () => { vid.paused ? (A.pauseMusicForVideo && A.pauseMusicForVideo(), vid.play().catch(() => {})) : vid.pause(); };
        vid.onplay = () => { $('#vPlay').textContent = '❚❚'; Object.values(A.els).forEach(e => e.pause()); };
        vid.onpause = () => { $('#vPlay').textContent = '▶'; if (A.curId && A.set.master && A.set.musicOn && !A.userPaused) A.playBgm(A.curId); };
        vid.ontimeupdate = () => { $('#vProg').value = vid.duration ? vid.currentTime / vid.duration * 1000 : 0; $('#vTime').textContent = tm(vid.currentTime) + ' / ' + tm(vid.duration); };
        vid.onloadedmetadata = vid.ontimeupdate;
        vid.onerror = () => { const e = $('#vErr'); if (e) e.hidden = false; };
        $('#vProg').oninput = e => { if (vid.duration) vid.currentTime = e.target.value / 1000 * vid.duration; };
        $('#vVol').oninput = e => { vid.volume = +e.target.value; vid.muted = false; $('#vMute').textContent = vid.volume ? '♪' : '✕'; };
        $('#vMute').onclick = () => { vid.muted = !vid.muted; $('#vMute').textContent = vid.muted ? '✕' : '♪'; };
      };
      PP.$('#vTabs', root).addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) show(+c.dataset.i); });
      show(0);
    };
    return inst;
  };

  /* =====================================================
     REFLEKSI
     ===================================================== */
  const RQ = ['Apa hal baru yang kamu pelajari?', 'Bagian mana yang paling mudah dipahami?', 'Bagian mana yang masih sulit?', 'Bagaimana penerapan Teorema Pythagoras dalam kehidupan sehari-hari?'];
  PP.screens.refleksi = function () {
    const r = S.data.reflection || { a: ['', '', '', ''], date: 0 };
    return {
      html: `<div class="wrap narrow"><div class="panel fill pad"><h2 class="h-title">Refleksi Pembelajaran</h2>
        <p class="small" style="margin:0 0 4px">Ceritakan dengan kata-katamu sendiri. Tidak ada jawaban yang salah di sini.</p>
        <form id="rfForm" style="flex:1;min-height:0;display:flex;flex-direction:column">
        <div class="rv-head"><span class="pill" id="rfPos"></span><div class="dots" id="rfDots"></div></div>
        <div style="flex:1;min-height:0;display:flex;flex-direction:column">${RQ.map((q, i) => `<label class="fld rf-q" data-q="${i}" style="flex:1;min-height:0">${i + 1}. ${q}<textarea id="rf${i}" maxlength="600" style="flex:1;min-height:60px" placeholder="Tulis jawabanmu di sini">${PP.esc(r.a[i])}</textarea></label>`).join('')}</div>
        <p class="err" id="rfErr" hidden>Isi minimal satu jawaban sebelum menyimpan.</p>
        <p class="small muted" id="rfDate" style="margin:2px 0">${r.date ? 'Terakhir disimpan: ' + new Date(r.date).toLocaleString('id-ID') : 'Belum pernah disimpan.'}</p>
        <div class="row between" style="margin:2px 0 0"><button class="btn sm" type="button" id="rfPrev">◀</button><button class="btn green" type="submit">Simpan</button><button class="btn sm" type="button" id="rfNext">▶</button></div></form></div></div>`,
      mount(root) {
        let qi = 0;
        const draw = () => {
          PP.$$('.rf-q', root).forEach((l, i) => l.hidden = i !== qi);
          PP.$('#rfPos', root).textContent = 'Pertanyaan ' + (qi + 1) + ' / ' + RQ.length;
          PP.$('#rfDots', root).innerHTML = RQ.map((_, i) => `<i class="${i === qi ? 'on' : ''}"></i>`).join('');
          PP.$('#rfPrev', root).disabled = qi === 0; PP.$('#rfNext', root).disabled = qi === RQ.length - 1;
        };
        PP.$('#rfPrev', root).onclick = () => { qi--; draw(); }; PP.$('#rfNext', root).onclick = () => { qi++; draw(); };
        draw();
        PP.$('#rfForm', root).addEventListener('submit', e => {
          e.preventDefault();
          const a = RQ.map((_, i) => PP.$('#rf' + i, root).value.trim());
          if (!a.some(Boolean)) { PP.$('#rfErr', root).hidden = false; return; }
          PP.$('#rfErr', root).hidden = true;
          const first = !S.data.reflection; S.data.reflection = { a, date: Date.now() }; S.save();
          if (first) { S.award('reflect'); S.addXP(15, true); }
          PP.$('#rfDate', root).textContent = 'Terakhir disimpan: ' + new Date().toLocaleString('id-ID');
          PP.ui.toast('Refleksi tersimpan. Terima kasih!'); A.sfx('correct');
        });
      }
    };
  };

  /* =====================================================
     PROGRAM PENILAIAN
     ===================================================== */
  const GN = { A: 'Game A · Susun Segitiga', B: 'Game B · Temukan Panjang Sisi', C: 'Game C · Misi Jembatan', D: 'Game D · Tantangan Akhir' };
  function data() {
    const d = S.data, q = d.quiz.best, ql = d.quiz.last, score = S.finalScore();
    return { d, q, ql, score, pr: S.predikat(score) };
  }
  function csv() {
    const { d, q, score, pr } = data(), rows = [];
    const add = (...c) => rows.push(c.map(x => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(','));
    add('Laporan Hasil Belajar - Petualangan Pythagoras'); add('Nama', d.name || '-'); add('Kelas', d.kelas || '-'); add('Tanggal cetak', new Date().toLocaleString('id-ID')); add();
    add('Ringkasan'); add('Progres misi', S.doneCount() + ' dari 6'); add('Level', S.level()); add('XP', d.xp); add('Total bintang', S.totalStars() + ' dari ' + S.maxStars());
    add('Nilai akhir', score); add('Predikat', pr.t); add('Jawaban benar (semua aktivitas)', d.tally.correct); add('Jawaban salah (semua aktivitas)', d.tally.wrong); add();
    add('Misi', 'Status', 'Bintang');
    PP.POS.forEach(p => add('Pos ' + p.id + ' ' + p.name, S.missionDone(p.id) ? 'Selesai' : 'Belum', S.missionDone(p.id) ? d.missions[p.id].stars : 0)); add();
    add('Game', 'Skor terbaik', 'Bintang', 'Jumlah main', 'Benar', 'Salah');
    ['A', 'B', 'C', 'D'].forEach(k => { const g = d.games[k]; add(GN[k], g ? g.best : 0, g ? g.stars : 0, g ? g.plays : 0, g ? g.correct : 0, g ? g.wrong : 0); }); add();
    add('Kuis', 'Nilai terbaik', 'Benar', 'Salah', 'Kosong', 'Percobaan'); add('Kuis Interaktif', q ? q.score : '-', q ? q.correct : '-', q ? q.wrong : '-', q ? q.blank : '-', d.quiz.attempts); add();
    add('Lencana', 'Diperoleh'); PP.BADGES.forEach(b => add(b.name, d.badges[b.id] ? 'Ya' : 'Belum'));
    return rows.join('\r\n');
  }
  function fileName() { return 'hasil-belajar-' + (S.data.name || 'siswa').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv'; }
  PP.acts['csv-dl'] = () => {
    try {
      const blob = new Blob(['﻿' + csv()], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(); document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); PP.ui.toast('File CSV diunduh.');
    } catch (e) { PP.ui.toast('Unduhan gagal. Gunakan Salin CSV.', 'x'); }
  };
  PP.acts['csv-copy'] = () => {
    const t = csv();
    const fallback = () => PP.ui.modal(`<h3>Salin laporan CSV</h3><p class="modal-text small">Pilih semua teks di bawah, salin, lalu tempel ke Excel atau Google Sheets.</p><textarea class="csvbox" readonly rows="10">${PP.esc(t)}</textarea><div class="row end"><button class="btn" data-close>Tutup</button></div>`);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => PP.ui.toast('CSV disalin ke clipboard.'), fallback); else fallback();
  };
  PP.acts.print = () => { try { window.print(); } catch (e) { PP.ui.toast('Cetak tidak tersedia di sini.', 'x'); } };

  PP.screens.nilai = function () {
    const { d, q, score, pr } = data(), done = S.doneCount();
    const gr = ['A', 'B', 'C', 'D'].map(k => { const g = d.games[k]; return `<tr><td>${GN[k]}</td><td>${g ? g.best : '-'}</td><td>${g ? PP.stars(g.stars) : '-'}</td><td>${g ? g.correct : 0}</td><td>${g ? g.wrong : 0}</td></tr>`; }).join('');
    const tbl = (head, body) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
    const panes = {
      'Ringkasan': `<p class="pill big">Predikat: ${pr.t}</p><p>${pr.d}</p>
        <p class="small muted">Nilai akhir = 40% kuis + 40% rata-rata skor game + 20% progres misi.</p>
        <h3 class="h-sub">Progres Petualangan (${done}/6)</h3><div class="bar"><i style="width:${done / 6 * 100}%"></i></div>
        ${tbl(['Pos', 'Status', 'Bintang'], PP.POS.map(p => `<tr><td>${p.id}. ${p.name}</td><td>${S.missionDone(p.id) ? 'Selesai' : S.missionUnlocked(p.id) ? 'Terbuka' : 'Terkunci'}</td><td>${S.missionDone(p.id) ? PP.stars(d.missions[p.id].stars) : '-'}</td></tr>`).join(''))}`,
      'Game & Kuis': `<h3 class="h-sub">Skor Game</h3>${tbl(['Game', 'Terbaik', 'Bintang', 'Benar', 'Salah'], gr)}
        <h3 class="h-sub">Kuis Interaktif</h3>
        ${q ? `<div class="tbl-wrap"><table class="tbl"><tbody><tr><td>Nilai terbaik</td><td><b>${q.score}</b> (${S.predikat(q.score).t})</td></tr><tr><td>Benar / Salah / Kosong</td><td>${q.correct} / ${q.wrong} / ${q.blank}</td></tr><tr><td>Jumlah percobaan</td><td>${d.quiz.attempts}</td></tr></tbody></table></div>` : '<p class="muted">Kuis belum dikerjakan. <button class="btn sm green" data-go="kuis">Kerjakan Kuis</button></p>'}`,
      'Lencana': `<h3 class="h-sub">Lencana (${Object.keys(d.badges).length}/${PP.BADGES.length})</h3>
        <div class="badges">${PP.BADGES.map(b => `<div class="badge ${d.badges[b.id] ? 'got' : ''}" title="${b.desc}">${PP.img(b.icon)}<b>${b.name}</b><span>${b.desc}</span></div>`).join('')}</div>`,
      'Refleksi': d.reflection ? `<h3 class="h-sub">Refleksi</h3><ol class="small">${RQ.map((x, i) => `<li><b>${x}</b><br>${PP.esc(d.reflection.a[i]) || '-'}</li>`).join('')}</ol>` : '<p class="muted">Refleksi belum diisi. <button class="btn sm green" data-go="refleksi">Isi Refleksi</button></p>'
    };
    const names = Object.keys(panes);
    return {
      html: `<div class="wrap"><div class="panel fill pad report" id="report">
        <div class="rp-head"><div class="rp-av">${PP.img(PP.me().idle)}</div><div><h2 class="h-title" style="margin:0">Program Penilaian</h2><p style="margin:0"><b>${PP.esc(d.name || 'Belum mengisi nama')}</b>${d.kelas ? ' · Kelas ' + PP.esc(d.kelas) : ''}</p><p class="small muted" style="margin:0">Petualangan Pythagoras · ${new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</p></div></div>
        ${d.name ? '' : '<p class="err" style="margin:2px 0">Nama belum diisi. <button class="btn sm" data-go="profil">Isi Profil</button></p>'}
        <div class="fin-stats"><div><b>${score}</b><span>Nilai Akhir</span></div><div><b>${S.totalStars()}/${S.maxStars()}</b><span>Bintang</span></div><div><b>Lv ${S.level()}</b><span>${d.xp} XP</span></div><div><b>${d.tally.correct}/${d.tally.wrong}</b><span>Benar/Salah</span></div></div>
        <nav class="tabs no-print">${names.map((n, i) => `<button class="tab ${i ? '' : 'on'}" data-rp="${i}">${n}</button>`).join('')}</nav>
        <div class="scrollbox grow">${names.map((n, i) => `<div class="rp-pane" data-p="${i}" ${i ? 'hidden' : ''}>${panes[n]}</div>`).join('')}</div>
        <div class="row center no-print" style="margin:4px 0 0">${IN_VIEWER ? '' : '<button class="btn green sm" data-act="print">Cetak</button><button class="btn blue sm" data-act="csv-dl">Unduh CSV</button>'}<button class="btn sm ${IN_VIEWER ? 'blue' : ''}" data-act="csv-copy">Salin CSV</button></div>
      </div></div>`,
      mount(root) {
        PP.$$('[data-rp]', root).forEach(b => b.onclick = () => {
          PP.$$('[data-rp]', root).forEach(x => x.classList.toggle('on', x === b));
          PP.$$('.rp-pane', root).forEach(p => p.hidden = p.dataset.p !== b.dataset.rp);
        });
      }
    };
  };
})();

</script>
</body>
</html>
